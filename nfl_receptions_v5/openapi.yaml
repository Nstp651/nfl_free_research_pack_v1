openapi: 3.1.0
info:
  title: NFL Receptions V5 Control Plane
  version: 5.0.0
  description: Betting Platform V1 pre-market control plane. Locks research, checkpoints market-blind context, executes Layer 2 and persists immutable P_model. No sportsbook data.
servers:
  - url: https://nfl-receptions-platform-v5.nickarnott01.workers.dev
paths:
  /health:
    get:
      operationId: healthNflReceptionsV5
      summary: Check NFL V5 control-plane state service
      responses:
        '200': {description: Healthy, content: {application/json: {schema: {$ref: '#/components/schemas/AnyObject'}}}}
        '503': {$ref: '#/components/responses/Error'}
  /v1/runs:
    post:
      operationId: createNflReceptionsRunV5
      summary: Start and lock one new pre-market NFL fixture run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [season, week, game_id, fixture_date_sydney, validated_kickoff_utc]
              properties:
                season: {type: integer, minimum: 2000, maximum: 2100}
                week: {type: integer, minimum: 1, maximum: 18}
                game_id: {type: string, pattern: '^[0-9]{4}_[0-9]{2}_[A-Z0-9]{2,4}_[A-Z0-9]{2,4}$'}
                fixture_date_sydney: {type: string, format: date}
                validated_kickoff_utc: {type: string, format: date-time}
      responses:
        '200': {description: Locked run, content: {application/json: {schema: {$ref: '#/components/schemas/AnyObject'}}}}
        '422': {$ref: '#/components/responses/Error'}
  /v1/runs/{run_id}:
    get:
      operationId: getNflReceptionsRunV5
      summary: Get authoritative run state and receipts
      parameters: [{$ref: '#/components/parameters/RunId'}]
      responses:
        '200': {description: Run status, content: {application/json: {schema: {$ref: '#/components/schemas/AnyObject'}}}}
        '422': {$ref: '#/components/responses/Error'}
  /v1/runs/{run_id}/research:
    get:
      operationId: getNflReceptionsResearchV5
      summary: Retrieve a page of the exact locked NFL research pack before checkpoint
      parameters:
        - {$ref: '#/components/parameters/RunId'}
        - {name: offset, in: query, required: false, schema: {type: integer, minimum: 0, default: 0}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 20, default: 10}}
      responses:
        '200': {description: Locked research page, content: {application/json: {schema: {$ref: '#/components/schemas/AnyObject'}}}}
        '422': {$ref: '#/components/responses/Error'}
    post:
      operationId: checkpointNflReceptionsResearchV5
      summary: Persist the complete market-blind Layer 1 research receipt
      parameters: [{$ref: '#/components/parameters/RunId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [context]
              properties:
                context: {$ref: '#/components/schemas/AnyObject'}
      responses:
        '200': {description: Research checkpoint receipt, content: {application/json: {schema: {$ref: '#/components/schemas/AnyObject'}}}}
        '422': {$ref: '#/components/responses/Error'}
  /v1/runs/{run_id}/compute:
    post:
      operationId: computeNflReceptionsFreezeV5
      summary: Execute deterministic Layer 2 and atomically freeze the complete receptions P_model
      parameters: [{$ref: '#/components/parameters/RunId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [model_input]
              properties:
                model_input: {$ref: '#/components/schemas/AnyObject'}
      responses:
        '200': {description: Frozen model receipt, content: {application/json: {schema: {$ref: '#/components/schemas/AnyObject'}}}}
        '422': {$ref: '#/components/responses/Error'}
  /v1/runs/{run_id}/freeze:
    get:
      operationId: getNflReceptionsFrozenArtifactV5
      summary: Retrieve the immutable complete frozen P_model artifact
      parameters: [{$ref: '#/components/parameters/RunId'}]
      responses:
        '200': {description: Frozen artifact, content: {application/json: {schema: {$ref: '#/components/schemas/AnyObject'}}}}
        '422': {$ref: '#/components/responses/Error'}
  /v1/runs/{run_id}/players/{player_id}:
    get:
      operationId: getNflReceptionsFrozenPlayerV5
      summary: Retrieve one exact frozen player ladder
      parameters:
        - {$ref: '#/components/parameters/RunId'}
        - {name: player_id, in: path, required: true, schema: {type: string, pattern: '^[A-Z0-9_-]{3,64}$'}}
      responses:
        '200': {description: Frozen player, content: {application/json: {schema: {$ref: '#/components/schemas/AnyObject'}}}}
        '422': {$ref: '#/components/responses/Error'}
components:
  parameters:
    RunId:
      name: run_id
      in: path
      required: true
      schema: {type: string, pattern: '^[a-f0-9]{64}$'}
  schemas:
    AnyObject:
      type: object
      additionalProperties: true
    Error:
      type: object
      properties:
        error: {type: string}
        market_data: {type: boolean}
        p_model_status: {type: string}
      additionalProperties: true
  responses:
    Error:
      description: Request rejected by platform integrity gate
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
