openapi: 3.1.0
info:
  title: NFL Receptions V5 Control Plane
  version: 5.0.3
  description: >
    Betting Platform V1 pre-market control plane. Locks research, checkpoints
    market-blind context, executes Layer 2 and persists immutable P_model.
    Runtime contract 5.0.3 mirrors the live Worker validators to prevent
    schema-discovery retries. No sportsbook data.
servers:
  - url: https://nfl-receptions-platform-v5.nickarnott01.workers.dev
paths:
  /health:
    get:
      operationId: healthNflReceptionsV5
      x-openai-isConsequential: false
      summary: Check NFL V5 control-plane state service
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string}
                additionalProperties: true
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/runs:
    post:
      operationId: createNflReceptionsRunV5
      x-openai-isConsequential: false
      summary: Start and lock one new pre-market NFL fixture run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunInit'
      responses:
        '200':
          description: Locked run
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id: {type: string}
                  status: {type: string}
                  p_model_status: {type: string}
                additionalProperties: true
        '422':
          description: Run rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/runs/{run_id}:
    get:
      operationId: getNflReceptionsRunV5
      x-openai-isConsequential: false
      summary: Get authoritative run state and receipts
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Run status
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id: {type: string}
                  status: {type: string}
                  p_model_status: {type: string}
                additionalProperties: true
        '422':
          description: Invalid run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/runs/{run_id}/research:
    get:
      operationId: getNflReceptionsResearchV5
      x-openai-isConsequential: false
      summary: Retrieve a page of the exact locked NFL research pack before checkpoint
      description: Use limit=20 in production to minimize pagination calls.
      parameters:
        - $ref: '#/components/parameters/RunId'
        - name: offset
          in: query
          required: false
          schema: {type: integer, minimum: 0, default: 0}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 20, default: 20}
      responses:
        '200':
          description: Locked research page
          content:
            application/json:
              schema:
                type: object
                properties:
                  players:
                    type: array
                    items:
                      type: object
                      properties:
                        player_id: {type: string}
                        player_name: {type: string}
                        current_team: {type: string}
                      additionalProperties: true
                  pagination:
                    type: object
                    properties:
                      next_offset:
                        type: [integer, 'null']
                    additionalProperties: true
                additionalProperties: true
        '422':
          description: Research unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: checkpointNflReceptionsResearchV5
      x-openai-isConsequential: false
      summary: Persist the complete market-blind Layer 1 research receipt
      description: >
        Submit one complete market-blind checkpoint. The request schema mirrors
        the Worker's exact-key and enum validation so callers can validate before
        submission instead of discovering the contract through 422 retries.
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [context]
              additionalProperties: false
              properties:
                context:
                  $ref: '#/components/schemas/ResearchContext'
      responses:
        '200':
          description: Research checkpoint receipt
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string}
                  research_receipt_sha256: {type: string}
                additionalProperties: true
        '422':
          description: Checkpoint rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/runs/{run_id}/compute:
    post:
      operationId: computeNflReceptionsFreezeV5
      x-openai-isConsequential: false
      summary: Execute deterministic Layer 2 and atomically freeze the complete receptions P_model
      description: >
        Every scenario must parameterize every player declared in the enclosing
        team.players array exactly once. Use only canonical Confidence/Fragility
        labels and the exact engine identifier.
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model_input]
              additionalProperties: false
              properties:
                model_input:
                  $ref: '#/components/schemas/ModelInput'
      responses:
        '200':
          description: Frozen model receipt
          content:
            application/json:
              schema:
                type: object
                properties:
                  complete_model_integrity_confirmed: {type: boolean}
                  p_model_status: {type: string}
                additionalProperties: true
        '422':
          description: Compute rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/runs/{run_id}/freeze:
    get:
      operationId: getNflReceptionsFrozenArtifactV5
      x-openai-isConsequential: false
      summary: Retrieve the immutable complete frozen P_model artifact
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Frozen artifact
          content:
            application/json:
              schema:
                type: object
                properties:
                  p_model_status: {type: string}
                additionalProperties: true
        '422':
          description: Frozen artifact unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/runs/{run_id}/players/{player_id}:
    get:
      operationId: getNflReceptionsFrozenPlayerV5
      x-openai-isConsequential: false
      summary: Retrieve one exact frozen player ladder
      parameters:
        - $ref: '#/components/parameters/RunId'
        - name: player_id
          in: path
          required: true
          schema: {type: string, pattern: '^[A-Z0-9_-]{3,64}$'}
      responses:
        '200':
          description: Frozen player
          content:
            application/json:
              schema:
                type: object
                properties:
                  player_id: {type: string}
                  freeze_receipt_sha256: {type: string}
                additionalProperties: true
        '422':
          description: Frozen player unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  parameters:
    RunId:
      name: run_id
      in: path
      required: true
      schema: {type: string, pattern: '^[a-f0-9]{64}$'}

  schemas:
    ErrorResponse:
      type: object
      properties:
        error: {type: string}
      additionalProperties: true

    RunInit:
      type: object
      additionalProperties: false
      required: [season, week, game_id, fixture_date_sydney, validated_kickoff_utc]
      properties:
        season: {type: integer, minimum: 2000, maximum: 2100}
        week: {type: integer, minimum: 1, maximum: 18}
        game_id: {type: string, pattern: '^[0-9]{4}_[0-9]{2}_[A-Z0-9]{2,4}_[A-Z0-9]{2,4}$'}
        fixture_date_sydney: {type: string, format: date}
        validated_kickoff_utc: {type: string, format: date-time}

    PackReceipt:
      type: object
      additionalProperties: false
      required: [source_anchor_sha256, pack_revision, retrieved_player_count]
      properties:
        source_anchor_sha256: {type: string}
        pack_revision: {type: string}
        retrieved_player_count: {type: integer}

    CurrentInformationState:
      type: object
      description: Market-blind current-information state. No sportsbook fields.
      properties:
        mode: {type: string}
      additionalProperties: true

    Evidence:
      type: object
      additionalProperties: false
      required: [evidence_id, source, source_url, source_date, checked_at, subject, finding, model_pathway, availability]
      properties:
        evidence_id: {type: string, pattern: '^[A-Z0-9_-]{3,80}$'}
        source: {type: string}
        source_url: {type: [string, 'null']}
        source_date: {type: [string, 'null']}
        checked_at: {type: string, format: date-time}
        subject: {type: string}
        finding: {type: string}
        model_pathway:
          type: string
          enum: [TEAM_PASS_OPPORTUNITY, ROUTES, TARGETS, CATCH_CONVERSION, QB, PERSONNEL, DEFENSE, WEATHER, ROLE, AVAILABILITY, SYSTEM, OTHER]
        availability:
          type: string
          enum: [VERIFIED, PARTIAL, UNAVAILABLE, UNKNOWN]

    TeamContext:
      type: object
      additionalProperties: false
      required: [team, summary, evidence_ids]
      properties:
        team: {type: string}
        summary: {type: string}
        evidence_ids:
          type: array
          minItems: 1
          maxItems: 30
          items: {type: string}

    DefensivePart:
      type: object
      additionalProperties: false
      required: [status, summary, evidence_ids]
      properties:
        status:
          type: string
          enum: [VERIFIED, PARTIAL, UNAVAILABLE]
          description: UNKNOWN is not valid here; use UNAVAILABLE plus limitations/evidence availability.
        summary: {type: string}
        evidence_ids:
          type: array
          minItems: 1
          maxItems: 30
          items: {type: string}

    DefensiveProfile:
      type: object
      additionalProperties: false
      required: [team, passing_opportunities_faced, position_depth_concessions, pressure_protection, current_personnel, limitations]
      properties:
        team: {type: string}
        passing_opportunities_faced:
          $ref: '#/components/schemas/DefensivePart'
        position_depth_concessions:
          $ref: '#/components/schemas/DefensivePart'
        pressure_protection:
          $ref: '#/components/schemas/DefensivePart'
        current_personnel:
          $ref: '#/components/schemas/DefensivePart'
        limitations:
          type: array
          maxItems: 50
          items: {type: string}

    ResearchPlayer:
      type: object
      additionalProperties: false
      required: [player_id, player_name, team, research_status, evidence_ids, handoff_summary]
      properties:
        player_id: {type: string, pattern: '^[A-Z0-9_-]{3,64}$'}
        player_name: {type: string}
        team: {type: string}
        research_status:
          type: string
          enum: [INCLUDE, WATCHLIST, EXCLUDE]
        evidence_ids:
          type: array
          minItems: 1
          maxItems: 30
          items: {type: string}
        handoff_summary: {type: string}

    ResearchContext:
      type: object
      additionalProperties: false
      required: [game_id, completed_at, pack_receipt, current_information_state, research_quality_permission, evidence, team_contexts, defensive_profiles, players, material_unknowns, research_summary]
      properties:
        game_id: {type: string}
        completed_at: {type: string, format: date-time}
        pack_receipt:
          $ref: '#/components/schemas/PackReceipt'
        current_information_state:
          $ref: '#/components/schemas/CurrentInformationState'
        research_quality_permission:
          type: string
          enum: ["YES", "NO"]
        evidence:
          type: array
          minItems: 4
          maxItems: 500
          items:
            $ref: '#/components/schemas/Evidence'
        team_contexts:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/TeamContext'
        defensive_profiles:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/DefensiveProfile'
        players:
          type: array
          minItems: 2
          maxItems: 60
          items:
            $ref: '#/components/schemas/ResearchPlayer'
        material_unknowns:
          type: array
          maxItems: 100
          items: {type: string}
        research_summary: {type: string}

    DiscretePoint:
      type: object
      additionalProperties: false
      required: [value, probability]
      properties:
        value: {type: integer}
        probability: {type: number, minimum: 0, maximum: 1}

    BetaRate:
      type: object
      additionalProperties: false
      required: [mean, strength]
      properties:
        mean: {type: number, minimum: 0, maximum: 1}
        strength: {type: number, minimum: 0}

    PlayerMeta:
      type: object
      additionalProperties: false
      required: [player_id, player_name, confidence, fragility, key_assumptions]
      properties:
        player_id: {type: string, pattern: '^[A-Z0-9_-]{3,64}$'}
        player_name: {type: string}
        confidence:
          type: string
          enum: [HIGH, MEDIUM, LOW]
        fragility:
          type: string
          enum: [LOW, MODERATE, HIGH]
        key_assumptions:
          type: array
          maxItems: 20
          items: {type: string}

    PlayerParam:
      type: object
      additionalProperties: false
      required: [player_id, target_method, target_rate, catch_rate, route_counts]
      properties:
        player_id: {type: string}
        target_method:
          type: string
          enum: [A, B]
        target_rate:
          $ref: '#/components/schemas/BetaRate'
        catch_rate:
          $ref: '#/components/schemas/BetaRate'
        route_counts:
          type: [array, 'null']
          description: Required key. May be null for Method A; must be a discrete support for Method B.
          items:
            $ref: '#/components/schemas/DiscretePoint'

    Scenario:
      type: object
      additionalProperties: false
      required: [scenario_id, weight, targetable_passes, other_share, player_params, football_rationale]
      properties:
        scenario_id: {type: string, pattern: '^[A-Z0-9_-]{2,64}$'}
        weight: {type: number, minimum: 0, maximum: 1}
        targetable_passes:
          type: array
          minItems: 1
          maxItems: 121
          items:
            $ref: '#/components/schemas/DiscretePoint'
        other_share: {type: number, minimum: 0, maximum: 1}
        player_params:
          type: array
          minItems: 1
          maxItems: 20
          description: MUST contain exactly one parameter row for every player declared in the enclosing team.players array.
          items:
            $ref: '#/components/schemas/PlayerParam'
        football_rationale: {type: string}

    TeamModel:
      type: object
      additionalProperties: false
      required: [team, players, scenarios]
      properties:
        team: {type: string, pattern: '^[A-Z0-9]{2,4}$'}
        players:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/PlayerMeta'
        scenarios:
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: '#/components/schemas/Scenario'

    LedgerItem:
      type: object
      additionalProperties: false
      required: [parameter_path, evidence_ids, rationale]
      properties:
        parameter_path: {type: string}
        evidence_ids:
          type: array
          minItems: 1
          maxItems: 20
          items: {type: string}
        rationale: {type: string}

    ModelInput:
      type: object
      additionalProperties: false
      required: [game_id, engine_version, threshold_max, teams, source_to_parameter_ledger]
      properties:
        game_id: {type: string}
        engine_version:
          type: string
          enum: [NFL_RECEPTIONS_V5_EXACT_HBB_1.0.0]
        threshold_max: {type: integer, minimum: 1, maximum: 20}
        teams:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/TeamModel'
        source_to_parameter_ledger:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/LedgerItem'
