openapi: 3.1.0
info:
  title: NFL Receptions V5 Post-Freeze Market
  version: 5.0.0
  description: Betting Platform V1 post-freeze Australian NFL receptions integration. A valid frozen run_id is mandatory; the service refuses Odds API access until authoritative freeze verification passes.
servers:
  - url: https://nfl-receptions-market-v5.nickarnott01.workers.dev
paths:
  /health:
    get:
      operationId: healthNflReceptionsMarketV5
      summary: Check market adapter configuration without consuming an Odds API market request
      responses:
        '200': {description: Healthy, content: {application/json: {schema: {$ref: '#/components/schemas/AnyObject'}}}}
        '503': {$ref: '#/components/responses/Error'}
  /v1/receptions:
    get:
      operationId: getNflReceptionsBoardV5
      summary: Verify frozen run, retrieve current AU receptions markets, exact-map frozen thresholds and rank positive edges
      parameters:
        - name: run_id
          in: query
          required: true
          schema: {type: string, pattern: '^[a-f0-9]{64}$'}
      responses:
        '200':
          description: Deterministically integrated post-freeze board
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnyObject'}
        '400': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
components:
  schemas:
    AnyObject:
      type: object
      additionalProperties: true
    Error:
      type: object
      required: [error]
      properties:
        error: {type: string}
      additionalProperties: true
  responses:
    Error:
      description: Market request rejected or unavailable
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
