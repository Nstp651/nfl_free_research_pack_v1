openapi: 3.1.0
info:
  title: NBL Player Props Market Gateway
  version: 1.1.0
  description: Post-freeze NBL assists/rebounds market retrieval and evaluation. Live Odds API access and all supplied market rows are rejected until the exact research run is immutably frozen.
servers:
  - url: https://nbl-player-props-market-v1.nickarnott01.workers.dev
paths:
  /health:
    get:
      operationId: healthNblPlayerPropsMarket
      summary: Check NBL market gateway health and whether Odds API live retrieval is configured.
      responses:
        '200':
          description: Market gateway health.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /v1/fetch-odds-api:
    post:
      operationId: fetchNblPlayerPropsOddsApi
      summary: After freeze, retrieve live NBL assists/rebounds props from The Odds API and evaluate them against the immutable frozen model.
      description: Verifies the exact frozen run and receipt before any Odds API call. Resolves the exact NBL event and first requests assists, rebounds and alternate ladders in one event-scoped request. If The Odds API rejects the bundle because one or more keys are unsupported, the Worker probes each requested key individually so partial NBL support is detected precisely. Never mutates P_model.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                run_id:
                  type: string
                  pattern: '^[a-f0-9]{64}$'
                expected_freeze_receipt_sha256:
                  type: string
                  pattern: '^[a-f0-9]{64}$'
                markets:
                  type: array
                  minItems: 1
                  maxItems: 4
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                      - player_assists
                      - player_rebounds
                      - player_assists_alternate
                      - player_rebounds_alternate
              required: [run_id, expected_freeze_receipt_sha256]
              additionalProperties: false
      responses:
        '200':
          description: Live Odds API support status and, when rows exist, frozen-model evaluation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  market_data: {type: boolean}
                  p_model_mutated: {type: boolean}
                  p_model_status: {type: string}
                  run_id: {type: string}
                  fixture_id: {type: string}
                  freeze_receipt_sha256: {type: string}
                  frozen_at: {type: string}
                  odds_api_support:
                    type: string
                    enum: [NOT_CONFIGURED, EVENT_NOT_FOUND, UNSUPPORTED_MARKET, SUPPORTED_EMPTY, SUPPORTED_WITH_ROWS]
                  message: {type: string}
                  event:
                    type: object
                    additionalProperties: true
                  markets_requested:
                    type: array
                    items: {type: string}
                  markets_used:
                    type: array
                    items: {type: string}
                  markets_unsupported:
                    type: array
                    items: {type: string}
                  fallback_probed_individually: {type: boolean}
                  quota:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  market_records_received: {type: integer}
                  evaluation:
                    $ref: '#/components/schemas/EvaluationResponse'
                required: [market_data, p_model_mutated, p_model_status, run_id, fixture_id, freeze_receipt_sha256, frozen_at, odds_api_support, market_records_received]
                additionalProperties: true
        '422':
          description: Freeze binding, timing, event identity, market or upstream validation failure.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /v1/evaluate:
    post:
      operationId: evaluateNblPlayerPropsMarkets
      summary: Evaluate supplied exact post-freeze sportsbook rows against one immutable frozen NBL P_model.
      description: Use for screenshots or public-web prices after freeze. Every captured_at must be at or after frozen_at. Rows are resolved to frozen player identity, best-price deduplicated and evaluated without modifying P_model.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                run_id:
                  type: string
                  pattern: '^[a-f0-9]{64}$'
                expected_freeze_receipt_sha256:
                  type: string
                  pattern: '^[a-f0-9]{64}$'
                markets:
                  type: array
                  minItems: 1
                  maxItems: 250
                  items:
                    $ref: '#/components/schemas/MarketRecord'
              required: [run_id, expected_freeze_receipt_sha256, markets]
              additionalProperties: false
      responses:
        '200':
          description: Exact post-freeze EV evaluation and positive-edge ranking.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationResponse'
        '422':
          description: Freeze binding, timing, identity, threshold, market or probability validation failure.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
components:
  schemas:
    MarketRecord:
      type: object
      properties:
        fixture_id: {type: string}
        player_id: {type: [string, 'null']}
        player_name: {type: string}
        stat_type:
          type: string
          enum: [assists, rebounds]
        side:
          type: string
          enum: [over, under]
        threshold:
          type: number
          minimum: 0
          maximum: 40
        decimal_price:
          type: number
          exclusiveMinimum: 1
        bookmaker: {type: string}
        captured_at: {type: string}
        source_type:
          type: string
          enum: [odds_api, screenshot, public_web]
      required: [fixture_id, player_name, stat_type, side, threshold, decimal_price, bookmaker, captured_at, source_type]
      additionalProperties: false
    EvaluatedMarket:
      allOf:
        - $ref: '#/components/schemas/MarketRecord'
        - type: object
          properties:
            p_win: {type: number}
            p_push: {type: number}
            p_loss: {type: number}
            conditional_win_probability: {type: [number, 'null']}
            market_break_even_probability: {type: number}
            probability_edge: {type: [number, 'null']}
            fair_decimal_price: {type: [number, 'null']}
            ev_per_unit: {type: number}
            positive_ev: {type: boolean}
            confidence: {type: string}
            fragility: {type: string}
          additionalProperties: true
    EvaluationResponse:
      type: [object, 'null']
      properties:
        market_data: {type: boolean}
        p_model_mutated: {type: boolean}
        p_model_status: {type: string}
        run_id: {type: string}
        fixture_id: {type: string}
        freeze_receipt_sha256: {type: string}
        frozen_at: {type: string}
        market_records_received: {type: integer}
        market_records_evaluated: {type: integer}
        evaluated:
          type: array
          items:
            $ref: '#/components/schemas/EvaluatedMarket'
        positive_edges:
          type: array
          items:
            $ref: '#/components/schemas/EvaluatedMarket'
        best_single:
          oneOf:
            - $ref: '#/components/schemas/EvaluatedMarket'
            - type: 'null'
        no_forced_bet: {type: boolean}
      additionalProperties: true
