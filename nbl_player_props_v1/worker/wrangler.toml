name = "nbl-player-props-research-v1"
main = "index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[durable_objects]
bindings = [
  { name = "MATCH_RUNS", class_name = "NblMatchRun" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NblMatchRun"]

[build]
command = "if [ -f build_source_commit.mjs ]; then node build_source_commit.mjs; else node nbl_player_props_v1/worker/build_source_commit.mjs; fi"
