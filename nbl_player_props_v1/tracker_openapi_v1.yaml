openapi: 3.1.0
info:
  title: NBL Player Props Bet Tracker
  version: 1.0.0
  description: Records frozen NBL assists/rebounds model selections and user-confirmed wagers in Nick Bet Tracker. This Action never places bets.
servers:
  - url: https://nick-betting-api.nickarnott01.workers.dev
security:
  - apiKeyAuth: []
paths:
  /tracker/health:
    get:
      operationId: checkBetTracker
      summary: Check Nick Bet Tracker health.
      responses:
        '200':
          description: Tracker health.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackerHealth'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /tracker/model-runs:
    post:
      operationId: createModelRun
      x-openai-isConsequential: false
      summary: Store one completed frozen NBL model run.
      description: Call once after Layer 4. A stable request_id makes retries idempotent. This is bookkeeping only and must never feed Layers 1-2.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateModelRunRequest'
      responses:
        '200':
          description: Existing idempotent model run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateModelRunResponse'
        '201':
          description: New model run stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateModelRunResponse'
        '400':
          description: Invalid payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: request_id conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /tracker/bets:
    post:
      operationId: recordBet
      x-openai-isConsequential: false
      summary: Record a user-confirmed wager.
      description: Record only after Nick explicitly confirms the real bookmaker, accepted odds and stake. Every leg must reference an existing model_selection_id returned by createModelRun.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordBetRequest'
      responses:
        '200':
          description: Existing idempotent bet record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordBetResponse'
        '201':
          description: Bet recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordBetResponse'
        '400':
          description: Invalid payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Model selection not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: request_id conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-GPT-Action-Key
  schemas:
    ErrorResponse:
      type: object
      properties:
        error: {type: string}
        message: {type: string}
        model_run_id: {type: string}
        bet_ticket_id: {type: string}
      additionalProperties: true
    TrackerCounts:
      type: object
      properties:
        model_runs: {type: integer}
        model_selections: {type: integer}
        bet_tickets: {type: integer}
        bet_legs: {type: integer}
      additionalProperties: false
    TrackerHealth:
      type: object
      properties:
        service: {type: string}
        status: {type: string}
        api_version: {type: string}
        schema_version: {type: string}
        database_binding: {type: string}
        current_unit_size: {type: number}
        counts:
          $ref: '#/components/schemas/TrackerCounts'
      required: [service, status, api_version, schema_version, database_binding, current_unit_size, counts]
      additionalProperties: false
    ModelSelectionInput:
      type: object
      properties:
        selection_name: {type: string}
        player_name: {type: string}
        team_name: {type: string}
        market_family:
          type: string
          enum: [assists, rebounds]
        market_key:
          type: string
          enum: [player_assists, player_rebounds]
        side:
          type: string
          enum: [over, under]
        threshold: {type: number}
        p_model:
          type: number
          exclusiveMinimum: 0
          maximum: 1
        fair_odds:
          type: number
          minimum: 1
        confidence: {type: number}
        market_price_at_integration:
          type: number
          exclusiveMinimum: 1
        market_bookmaker_at_integration: {type: string}
        p_market_at_integration:
          type: number
          minimum: 0
          maximum: 1
        edge_at_integration: {type: number}
        ranking_score: {type: number}
        final_rank: {type: integer}
        final_play: {type: boolean}
        key_assumptions: {type: string}
        notes: {type: string}
      required: [selection_name, market_family, p_model]
      additionalProperties: false
    CreateModelRunRequest:
      type: object
      properties:
        request_id:
          type: string
          pattern: '^[A-Za-z0-9_-]{8,80}$'
        sport:
          type: string
          enum: [nbl]
        league:
          type: string
          enum: [nbl]
        model_name: {type: string}
        model_version: {type: string}
        season: {type: string}
        round_week: {type: string}
        fixture_date: {type: string}
        event_id: {type: string}
        home_team: {type: string}
        away_team: {type: string}
        fixture: {type: string}
        timing_mode: {type: string}
        frozen_at:
          type: string
          format: date-time
        research_state: {type: string}
        notes: {type: string}
        selections:
          type: array
          minItems: 1
          maxItems: 250
          items:
            $ref: '#/components/schemas/ModelSelectionInput'
      required: [sport, league, model_name, fixture, selections]
      additionalProperties: false
    ModelSelectionStored:
      type: object
      properties:
        id: {type: string}
        selection_name: {type: string}
        player_name: {type: string}
        team_name: {type: string}
        market_family: {type: string}
        market_key: {type: string}
        side: {type: string}
        threshold: {type: number}
        p_model: {type: number}
        fair_odds: {type: number}
        market_price_at_integration: {type: number}
        market_bookmaker_at_integration: {type: string}
        p_market_at_integration: {type: number}
        edge_at_integration: {type: number}
        final_rank: {type: integer}
        final_play: {type: boolean}
      required: [id, selection_name, market_family, p_model]
      additionalProperties: true
    CreateModelRunResponse:
      type: object
      properties:
        status: {type: string}
        idempotent: {type: boolean}
        request_id: {type: string}
        model_run_id: {type: string}
        selection_count: {type: integer}
        selections:
          type: array
          items:
            $ref: '#/components/schemas/ModelSelectionStored'
      required: [status, model_run_id, selection_count, selections]
      additionalProperties: true
    RecordBetLeg:
      type: object
      properties:
        model_selection_id: {type: string}
        execution_leg_odds:
          type: number
          exclusiveMinimum: 1
      required: [model_selection_id]
      additionalProperties: false
    RecordBetRequest:
      type: object
      properties:
        request_id:
          type: string
          pattern: '^[A-Za-z0-9_-]{8,80}$'
        bookmaker: {type: string}
        bet_type:
          type: string
          enum: [single, cross_match_multi, same_game_multi]
        stake:
          type: number
          exclusiveMinimum: 0
        accepted_odds:
          type: number
          exclusiveMinimum: 1
        unboosted_odds:
          type: number
          exclusiveMinimum: 1
        promo_label: {type: string}
        bookmaker_bet_id: {type: string}
        placed_at:
          type: string
          format: date-time
        notes: {type: string}
        legs:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/RecordBetLeg'
      required: [bookmaker, bet_type, stake, accepted_odds, legs]
      additionalProperties: false
    RecordedBetLeg:
      type: object
      properties:
        id: {type: string}
        leg_number: {type: integer}
        model_selection_id: {type: string}
        model_run_id: {type: string}
        selection_name: {type: string}
        fixture: {type: string}
      additionalProperties: true
    RecordBetResponse:
      type: object
      properties:
        status: {type: string}
        idempotent: {type: boolean}
        request_id: {type: string}
        bet_ticket_id: {type: string}
        bookmaker: {type: string}
        bet_type: {type: string}
        stake: {type: number}
        accepted_odds: {type: number}
        unit_size: {type: number}
        units_staked: {type: number}
        unboosted_odds: {type: number}
        promo_label: {type: string}
        legs:
          type: array
          items:
            $ref: '#/components/schemas/RecordedBetLeg'
      required: [status, bet_ticket_id, bookmaker, bet_type, stake, accepted_odds, unit_size, units_staked, legs]
      additionalProperties: true
