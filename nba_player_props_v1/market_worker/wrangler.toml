name = "nba-player-props-market-v1"
main = "index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[[services]]
binding = "RESEARCH_SERVICE"
service = "nba-player-props-research-v1"

[durable_objects]
bindings = [
  { name = "MARKET_RUNS", class_name = "NbaMarketRun" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NbaMarketRun"]

[vars]
ODDS_API_REGIONS = "au"
