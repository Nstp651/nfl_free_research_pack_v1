openapi: 3.1.0
info:
  title: NBA Assists + Rebounds V1 Post-Freeze Market Gateway
  version: 1.0.0
  description: Post-freeze-only Odds API and manual sportsbook screenshot ingestion plus exact-threshold Layer 4 ranking. This service never creates or mutates P_model.
servers:
  - url: https://nba-player-props-market-v1.nickarnott01.workers.dev
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: healthNbaPlayerPropsMarket
      summary: Check post-freeze Market Worker health and required bindings.
      responses:
        '200': {description: Health response, content: {application/json: {schema: {$ref: '#/components/schemas/Health'}}}}
  /v1/runs/{run_id}/refresh:
    post:
      operationId: refreshNbaPlayerPropsOddsApi
      summary: Refresh current Odds API player-prop prices for the already-frozen eligible slate and rerun Layer 4.
      description: The Worker obtains a fresh server market-access grant before making any sportsbook request. Only player_assists, player_assists_alternate, player_rebounds and player_rebounds_alternate are requested. Overs only are ranked. Reuse the same refresh_request_id only for an exact retry after an uncertain/lost response; the Worker replays the current persisted snapshot without another Odds API call.
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_request_id: {$ref: '#/components/schemas/RefreshRequestId'}
                regions: {type: string, default: au, pattern: '^[a-z,]+$'}
              required: [refresh_request_id]
              additionalProperties: false
      responses:
        '200': {description: Current API snapshot and refreshed rankings, content: {application/json: {schema: {$ref: '#/components/schemas/RefreshResponse'}}}}
  /v1/runs/{run_id}/manual-quotes:
    post:
      operationId: refreshNbaPlayerPropsManualMarkets
      summary: Replace the current manual sportsbook screenshot snapshot and rerun Layer 4 without changing P_model.
      description: Reuse refresh_request_id only to replay the exact same uncertain/lost write. Reusing an ID after its snapshot has been superseded is rejected.
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ManualRefreshRequest'}
      responses:
        '200': {description: Manual snapshot and revised rankings, content: {application/json: {schema: {$ref: '#/components/schemas/ManualRefreshResponse'}}}}
  /v1/runs/{run_id}/rankings:
    get:
      operationId: getNbaPlayerPropsRankings
      summary: Get current positive-edge rankings using the latest API plus latest manual screenshot snapshot.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200': {description: Current Layer 4 rankings, content: {application/json: {schema: {$ref: '#/components/schemas/Rankings'}}}}
  /v1/runs/{run_id}/state:
    get:
      operationId: getNbaPlayerPropsMarketState
      summary: Get current market snapshot receipts and immutable freeze identity.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200': {description: Market state summary, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    RunId:
      name: run_id
      in: path
      required: true
      schema: {type: string, minLength: 8}
  schemas:
    RefreshRequestId:
      type: string
      minLength: 8
      maxLength: 128
      pattern: '^[A-Za-z0-9_.:-]+$'
      description: Stable idempotency key for one exact market observation attempt. Generate a new value for every genuine new price refresh; reuse only after an uncertain/lost response.
    Health:
      type: object
      properties:
        ok: {type: boolean}
        service: {type: string}
        version: {type: string}
        post_freeze_only: {type: boolean}
        markets: {type: array, items: {type: string}}
        default_regions: {type: string}
        research_service_binding: {type: boolean}
        durable_object_binding: {type: boolean}
        odds_api_key_configured: {type: boolean}
      required: [ok, service, version, post_freeze_only]
      additionalProperties: true
    ManualQuote:
      type: object
      properties:
        game_id: {type: string}
        player_id: {type: string, description: Preferred when known from frozen model.}
        player_name: {type: string, description: May be used instead of player_id; resolution is strict and one-to-one.}
        stat_type: {type: string, enum: [assists, rebounds]}
        side: {type: string, enum: [over], default: over}
        threshold: {type: number, multipleOf: 0.5, minimum: 0}
        decimal_price: {type: number, exclusiveMinimum: 1}
        bookmaker: {type: string}
      required: [game_id, stat_type, threshold, decimal_price, bookmaker]
      additionalProperties: false
    ManualRefreshRequest:
      type: object
      properties:
        refresh_request_id: {$ref: '#/components/schemas/RefreshRequestId'}
        source_type: {type: string, enum: [BET365_SCREENSHOT, MANUAL_SPORTSBOOK_SCREENSHOT]}
        captured_at: {type: string, format: date-time, description: Actual post-freeze screenshot/ingestion capture time.}
        evidence_id: {type: string, minLength: 1}
        freeze_receipt_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        quotes: {type: array, minItems: 1, items: {$ref: '#/components/schemas/ManualQuote'}}
      required: [refresh_request_id, source_type, captured_at, evidence_id, freeze_receipt_sha256, quotes]
      additionalProperties: false
    RankedSelection:
      type: object
      properties:
        positive_edge_rank: {type: integer}
        game_id: {type: string}
        player_id: {type: string}
        player_name: {type: string}
        team: {type: string}
        stat_type: {type: string, enum: [assists, rebounds]}
        side: {type: string, enum: [over]}
        threshold: {type: number}
        decimal_price: {type: number}
        bookmaker: {type: string}
        p_win: {type: number}
        p_push: {type: number}
        p_loss: {type: number}
        fair_decimal_price: {type: [number, 'null']}
        market_break_even_probability: {type: number}
        probability_edge: {type: [number, 'null']}
        push_adjusted_market_probability: {type: number}
        push_adjusted_probability_edge: {type: number}
        ev_per_unit: {type: number}
        confidence: {type: string}
        fragility: {type: string}
        model_mean: {type: number}
        player_model_sha256: {type: string}
        head_model_sha256: {type: string}
        freeze_receipt_sha256: {type: string}
      required: [game_id, player_id, player_name, stat_type, side, threshold, decimal_price, bookmaker, p_win, p_push, p_loss, ev_per_unit]
      additionalProperties: true
    Rankings:
      type: object
      properties:
        schema_version: {type: string}
        run_id: {type: string}
        slate_date_et: {type: string, format: date}
        run_mode: {type: string}
        frozen_at: {type: string, format: date-time}
        freeze_receipt_sha256: {type: string}
        decision: {type: string, enum: [BEST_SINGLE, NO_BET]}
        best_single:
          oneOf:
            - {$ref: '#/components/schemas/RankedSelection'}
            - {type: 'null'}
        top_10_combined: {type: array, items: {$ref: '#/components/schemas/RankedSelection'}}
        assists_positive: {type: array, items: {$ref: '#/components/schemas/RankedSelection'}}
        rebounds_positive: {type: array, items: {$ref: '#/components/schemas/RankedSelection'}}
        all_evaluated: {type: array, items: {type: object, additionalProperties: true}}
        issues: {type: array, items: {type: object, additionalProperties: true}}
      required: [run_id, frozen_at, freeze_receipt_sha256, decision, top_10_combined, assists_positive, rebounds_positive]
      additionalProperties: true
    RefreshResponse:
      type: object
      properties:
        run_id: {type: string}
        layer: {type: string}
        freeze_receipt_sha256: {type: string}
        refresh:
          type: object
          properties:
            refresh_request_id: {$ref: '#/components/schemas/RefreshRequestId'}
            replayed: {type: boolean}
          required: [refresh_request_id, replayed]
          additionalProperties: true
        rankings: {$ref: '#/components/schemas/Rankings'}
      required: [run_id, freeze_receipt_sha256, refresh, rankings]
      additionalProperties: true
    ManualRefreshResponse:
      type: object
      properties:
        run_id: {type: string}
        layer: {type: string}
        freeze_receipt_sha256: {type: string}
        manual_snapshot:
          type: object
          properties:
            refresh_request_id: {$ref: '#/components/schemas/RefreshRequestId'}
            replayed: {type: boolean}
          required: [refresh_request_id, replayed]
          additionalProperties: true
        rankings: {$ref: '#/components/schemas/Rankings'}
      required: [run_id, freeze_receipt_sha256, manual_snapshot, rankings]
      additionalProperties: true
