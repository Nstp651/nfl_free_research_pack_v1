openapi: 3.1.0
info:
  title: NFL Free Research Pack
  version: 1.1.0
  description: >
    Pre-market NFL receptions research data built from free nflverse sources.
    Contains no sportsbook prices, lines, implied probabilities, market consensus,
    betting recommendations, or staking information.
servers:
  - url: https://YOUR-WORKER.YOUR-SUBDOMAIN.workers.dev

paths:
  /health:
    get:
      operationId: healthNflResearchPack
      summary: Check NFL research-pack service health
      responses:
        "200":
          description: Health response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /v1/packs:
    get:
      operationId: listNflResearchPacks
      summary: List available NFL research packs for a season/week
      parameters:
        - name: season
          in: query
          required: true
          schema:
            type: integer
          description: NFL season starting year, e.g. 2026.
        - name: week
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 18
          description: Regular-season week.
      responses:
        "200":
          description: Available fixtures and research-pack IDs
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /v1/packs/{game_id}:
    get:
      operationId: getNflResearchPack
      summary: Fetch one exact pre-market NFL receptions research pack
      parameters:
        - name: game_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]{4}_[0-9]{2}_[A-Z0-9]{2,4}_[A-Z0-9]{2,4}$'
          description: nflverse-style fixture ID, e.g. 2026_01_NE_SEA.
      responses:
        "200":
          description: Exact research pack
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          description: Research pack not found
