openapi: 3.1.0
info:
  title: NCAA Totals Research + Freeze Runtime
  version: 1.1.3.1
  description: Market-blind NCAA totals research/freeze service with server-enforced two-game checkpoint batches. No sportsbook data is returned.
servers:
  - url: https://ncaaf-totals-research-pack-v1.nickarnott01.workers.dev
paths:
  /health:
    get:
      operationId: healthNcaafTotalsResearchPack
      summary: Check research-pack freshness and source health
      responses:
        '200': {description: Health response, content: {application/json: {schema: {$ref: '#/components/schemas/Generic'}}}}
        '503': {description: Unhealthy service}
  /v1/slates:
    get:
      operationId: listNcaafTotalsResearchSlates
      summary: Resolve published NCAA research slate metadata
      parameters:
        - {name: season, in: query, required: true, schema: {type: integer, minimum: 2000, maximum: 2100}}
        - {name: week, in: query, required: true, schema: {type: integer, minimum: 0, maximum: 30}}
      responses:
        '200': {description: Slate metadata, content: {application/json: {schema: {$ref: '#/components/schemas/Generic'}}}}
  /v1/freeze-runs:
    post:
      operationId: startNcaafTotalsFreezeRun
      summary: Start one immutable, resumable, market-blind research run; does not freeze
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [season, week, window_start, window_end, timing_mode]
              properties:
                season: {type: integer, minimum: 2000, maximum: 2100}
                week: {type: integer, minimum: 0, maximum: 30}
                window_start: {type: string, format: date-time}
                window_end: {type: string, format: date-time}
                timing_mode: {type: string, enum: [NIGHT-BEFORE, MATCHDAY]}
      responses:
        '200': {description: Run lock/status, content: {application/json: {schema: {$ref: '#/components/schemas/Generic'}}}}
        '422': {description: Integrity/research failure}
        '503': {description: Service unavailable}
  /v1/freeze-runs/{run_id}:
    get:
      operationId: getNcaafTotalsFreezeRun
      summary: Recover run status, completed IDs, pending IDs and immutable freeze receipt
      parameters:
        - {$ref: '#/components/parameters/RunId'}
      responses:
        '200': {description: Run status, content: {application/json: {schema: {$ref: '#/components/schemas/Generic'}}}}
        '422': {description: Unknown/invalid run}
  /v1/freeze-runs/{run_id}/research:
    get:
      operationId: getNcaafTotalsFreezeResearch
      summary: Read only the next server-bounded batch of at most two pending games
      description: Repeated reads before checkpoint return the same current queue head. Do not preload later games. Market-blind.
      parameters:
        - {$ref: '#/components/parameters/RunId'}
      responses:
        '200': {description: Current pending batch, content: {application/json: {schema: {$ref: '#/components/schemas/Generic'}}}}
        '422': {description: Invalid/frozen run}
    post:
      operationId: checkpointNcaafTotalsResearch
      summary: Persist one or two complete research/context receipts from the current queue head; never freezes
      x-openai-isConsequential: false
      parameters:
        - {$ref: '#/components/parameters/RunId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [contexts]
              properties:
                contexts:
                  type: array
                  minItems: 1
                  maxItems: 2
                  items: {$ref: '#/components/schemas/FreezeContext'}
      responses:
        '200': {description: Updated completion/pending status, content: {application/json: {schema: {$ref: '#/components/schemas/Generic'}}}}
        '422': {description: Invalid, duplicate, stale or out-of-queue context}
  /v1/freeze-runs/{run_id}/compute:
    post:
      operationId: computeNcaafTotalsFreeze
      summary: Execute all-game audits and atomically persist whole-slate freeze; idempotent after success
      x-openai-isConsequential: false
      parameters:
        - {$ref: '#/components/parameters/RunId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '200': {description: Immutable freeze receipt, content: {application/json: {schema: {$ref: '#/components/schemas/Generic'}}}}
        '422': {description: Incomplete research or integrity failure}
  /v1/freeze-runs/{run_id}/games/{game_id}:
    get:
      operationId: getNcaafTotalsFrozenGame
      summary: Read exact persisted frozen game and full probability grid; never recompute
      parameters:
        - {$ref: '#/components/parameters/RunId'}
        - {name: game_id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Persisted frozen game, content: {application/json: {schema: {$ref: '#/components/schemas/Generic'}}}}
        '422': {description: Run not frozen or game not found}
components:
  parameters:
    RunId:
      name: run_id
      in: path
      required: true
      schema: {type: string, pattern: '^[a-f0-9]{64}$'}
  schemas:
    Generic:
      type: object
      additionalProperties: true
    Evidence:
      type: object
      additionalProperties: false
      required: [finding, checked_at, sources, unresolved]
      properties:
        finding: {type: string}
        checked_at: {type: string, format: date-time}
        sources: {type: array, minItems: 1, items: {type: string, format: uri}}
        unresolved: {type: boolean}
    Scenario:
      type: object
      additionalProperties: false
      required: [id, weight, shift, residual_scale, ledger_ids]
      properties:
        id: {type: string}
        weight: {type: number, exclusiveMinimum: 0, maximum: 1}
        shift: {type: number}
        residual_scale: {type: number, exclusiveMinimum: 0}
        ledger_ids: {type: array, items: {type: string}}
    LedgerItem:
      type: object
      additionalProperties: false
      required: [id, evidence, pathway, impact, quantified_basis]
      properties:
        id: {type: string}
        evidence: {$ref: '#/components/schemas/Evidence'}
        pathway: {type: string}
        impact: {type: string}
        quantified_basis: {type: string}
    ResearchReceipt:
      type: object
      additionalProperties: true
      required: [market_data, home_team, away_team, home, away, game, deep_triggers, deep_evidence]
      properties:
        market_data: {type: boolean, const: false}
        home_team: {type: string}
        away_team: {type: string}
        home: {type: object, additionalProperties: {$ref: '#/components/schemas/Evidence'}}
        away: {type: object, additionalProperties: {$ref: '#/components/schemas/Evidence'}}
        game: {type: object, additionalProperties: {$ref: '#/components/schemas/Evidence'}}
        deep_triggers: {type: array, items: {type: string}}
        deep_evidence: {type: array, items: {$ref: '#/components/schemas/Evidence'}}
    FreezeContext:
      type: object
      additionalProperties: false
      required: [game_id, contextual_shift, distribution_changed, scenarios, confidence, fragility, ledger, research, frozen_thesis]
      properties:
        game_id: {type: string}
        contextual_shift: {type: number}
        distribution_changed: {type: boolean}
        scenarios: {type: array, minItems: 1, maxItems: 8, items: {$ref: '#/components/schemas/Scenario'}}
        confidence: {type: string, enum: [A, A-, B+, B, B-, C+, C, D]}
        fragility: {type: string, enum: [LOW, MEDIUM, HIGH]}
        ledger: {type: array, items: {$ref: '#/components/schemas/LedgerItem'}}
        research: {$ref: '#/components/schemas/ResearchReceipt'}
        frozen_thesis: {type: string}
