openapi: 3.1.0
info:
  title: NCAA Totals Research Pack
  version: 1.1.0
  description: >-
    Read-only, pre-market NCAA Football FBS-v-FBS research and calibrated QBASE
    service. No odds, sportsbook prices, consensus lines or betting data are
    returned. QBASE slate probability schema supports integer and half-point
    totals with explicit push probability on integer lines.
servers:
  - url: https://ncaaf-totals-research-pack-v1.nickarnott01.workers.dev
paths:
  /health:
    get:
      operationId: healthNcaafTotalsResearchPack
      summary: Check research-pack freshness and source health
      responses:
        '200':
          description: Healthy research service
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Stale or incomplete research service
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/slates:
    get:
      operationId: listNcaafTotalsResearchSlates
      summary: Resolve the published NCAA research slate for a season and week
      parameters:
        - name: season
          in: query
          required: true
          schema: { type: integer, minimum: 2000, maximum: 2100 }
        - name: week
          in: query
          required: true
          schema: { type: integer, minimum: 0, maximum: 30 }
      responses:
        '200':
          description: Matching slate manifest entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema_version: { type: string }
                  market_data: { type: boolean }
                  season: { type: integer }
                  week: { type: integer }
                  slates:
                    type: array
                    items: { $ref: '#/components/schemas/SlateEntry' }
                  source_health: { type: object, additionalProperties: true }
                  freshness: { type: object, additionalProperties: true }
                  limitations:
                    type: array
                    items: { type: string }
                additionalProperties: true
  /v1/slates/{slate_id}:
    get:
      operationId: getNcaafTotalsResearchSlate
      summary: Fetch one immutable page of games from the weekly research slate
      description: >-
        Start offset 0 and follow pagination.next_offset to null at one
        pack_revision. Pass revision on later pages. On 409 discard mixed pages
        and restart once.
      parameters:
        - name: slate_id
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9]{4}_[0-9]{2}$' }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 8 }
        - name: revision
          in: query
          schema: { type: string, pattern: '^[a-f0-9]{16}$' }
      responses:
        '200':
          description: Research slate page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SlatePage' }
        '409':
          description: Research revision changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: Research source/schema failure
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Snapshot updating/stale
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/model/qbase:
    get:
      operationId: getNcaafTotalsQbase
      summary: Retrieve the calibrated market-blind NCAA totals QBASE artifact
      responses:
        '200':
          description: QBASE model artifact
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Qbase' }
        '502':
          description: QBASE source/validation failure
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/qbase/{slate_id}:
    get:
      operationId: getNcaafTotalsQbaseSlate
      summary: Fetch one immutable page of aligned market-blind QBASE outputs
      description: >-
        Start offset 0 and follow next_offset to null at one qbase_revision.
        Require research_pack_revision to match the loaded research slate.
      parameters:
        - name: slate_id
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9]{4}_[0-9]{2}$' }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 6 }
        - name: revision
          in: query
          schema: { type: string, pattern: '^[a-f0-9]{16}$' }
      responses:
        '200':
          description: QBASE slate page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QbaseSlatePage' }
        '409':
          description: QBASE revision changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: QBASE source/schema failure
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
        slate_id: { type: string }
        qbase_revision: { type: string }
      additionalProperties: true
    Health:
      type: object
      properties:
        ok: { type: boolean }
        service: { type: string }
        version: { type: string }
        market_data: { type: boolean }
        slate_count: { type: integer }
        fixture_count: { type: integer }
        source_health: { type: object, additionalProperties: true }
        freshness: { type: object, additionalProperties: true }
      additionalProperties: true
    SlateEntry:
      type: object
      properties:
        slate_id: { type: string }
        season: { type: integer }
        week: { type: integer }
        pack_revision: { type: string }
        game_count: { type: integer }
        current_season_data_through_week:
          type: [integer, 'null']
      additionalProperties: true
    TeamProfile:
      type: object
      properties:
        team_id: { type: string }
        team_name: { type: string }
        current: { type: object, additionalProperties: true }
        prior_season: { type: object, additionalProperties: true }
        preseason: { type: object, additionalProperties: true }
      additionalProperties: true
    Game:
      type: object
      properties:
        game_id: { type: string }
        fixture: { type: object, additionalProperties: true }
        home_profile: { $ref: '#/components/schemas/TeamProfile' }
        away_profile: { $ref: '#/components/schemas/TeamProfile' }
      additionalProperties: true
    SlatePage:
      type: object
      properties:
        schema_version: { type: string }
        slate_id: { type: string }
        pack_revision: { type: string }
        season: { type: integer }
        week: { type: integer }
        market_data: { type: boolean }
        data_state: { type: object, additionalProperties: true }
        source_health: { type: object, additionalProperties: true }
        source_receipt: { type: object, additionalProperties: true }
        limitations:
          type: array
          items: { type: string }
        games:
          type: array
          items: { $ref: '#/components/schemas/Game' }
        pagination: { $ref: '#/components/schemas/Pagination' }
      additionalProperties: true
    Qbase:
      type: object
      properties:
        model_name: { type: string }
        model_version: { type: string }
        feature_schema: { type: string }
        market_data: { type: boolean }
        selected_family: { type: string }
        alpha: { type: number }
        training_games: { type: integer }
        training_seasons:
          type: array
          items: { type: integer }
        features:
          type: array
          items: { type: string }
        imputer_medians:
          type: array
          items: { type: number }
        scaler_mean:
          type: array
          items: { type: number }
        scaler_scale:
          type: array
          items: { type: number }
        coefficients:
          type: array
          items: { type: number }
        intercept: { type: number }
        walk_forward: { type: object, additionalProperties: true }
        served_at_utc: { type: string, format: date-time }
      additionalProperties: true
    ProbabilityRow:
      type: object
      required: [line, over, push, under]
      properties:
        line: { type: number }
        over: { type: number, minimum: 0, maximum: 1 }
        push: { type: number, minimum: 0, maximum: 1 }
        under: { type: number, minimum: 0, maximum: 1 }
      additionalProperties: false
    QbaseGame:
      type: object
      properties:
        game_id: { type: string }
        home_team: { type: string }
        away_team: { type: string }
        expected_total_raw: { type: number }
        oos_bias_calibration: { type: number }
        expected_total_qbase: { type: number }
        residual_bucket: { type: string }
        residual_sd: { type: number }
        missing_feature_count_before_imputation: { type: integer }
        probability_grid:
          type: array
          items: { $ref: '#/components/schemas/ProbabilityRow' }
      additionalProperties: true
    QbaseSlatePage:
      type: object
      properties:
        schema_version: { type: string }
        probability_schema_version: { type: string }
        integer_line_method: { type: string }
        market_data: { type: boolean }
        slate_id: { type: string }
        season: { type: integer }
        week: { type: integer }
        research_pack_revision: { type: string }
        qbase_model_name: { type: string }
        qbase_model_version: { type: string }
        qbase_model_sha256: { type: string }
        qbase_revision: { type: string }
        supported_total_grid: { type: object, additionalProperties: true }
        walk_forward_reference: { type: object, additionalProperties: true }
        games:
          type: array
          items: { $ref: '#/components/schemas/QbaseGame' }
        pagination: { $ref: '#/components/schemas/Pagination' }
      additionalProperties: true
    Pagination:
      type: object
      properties:
        offset: { type: integer }
        returned: { type: integer }
        total_games: { type: integer }
        next_offset:
          type: [integer, 'null']
        revision: { type: string }
      additionalProperties: true
