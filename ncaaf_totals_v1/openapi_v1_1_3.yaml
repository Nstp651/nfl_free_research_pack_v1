openapi: 3.1.0
info:
  title: NCAA Totals Research Pack
  version: 1.1.3
  description: Read-only market-blind NCAA Football FBS-v-FBS research and calibrated
    QBASE service. V1.1.2 binds every QBASE game to exact game_id/team identity with
    qbase_anchor_sha256. No sportsbook or market data is returned.
servers:
- url: https://ncaaf-totals-research-pack-v1.nickarnott01.workers.dev
paths:
  /health:
    get:
      operationId: healthNcaafTotalsResearchPack
      summary: Check research-pack freshness and source health
      responses:
        '200':
          description: Healthy research service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Stale or incomplete research service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/slates:
    get:
      operationId: listNcaafTotalsResearchSlates
      summary: Resolve the published NCAA research slate
      parameters:
      - name: season
        in: query
        required: true
        schema:
          type: integer
          minimum: 2000
          maximum: 2100
      - name: week
        in: query
        required: true
        schema:
          type: integer
          minimum: 0
          maximum: 30
      responses:
        '200':
          description: Matching slate entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema_version:
                    type: string
                  market_data:
                    type: boolean
                  season:
                    type: integer
                  week:
                    type: integer
                  slates:
                    type: array
                    items:
                      $ref: '#/components/schemas/SlateEntry'
                  source_health:
                    type: object
                    additionalProperties: true
                  freshness:
                    type: object
                    additionalProperties: true
                  limitations:
                    type: array
                    items:
                      type: string
                additionalProperties: true
  /v1/slates/{slate_id}:
    get:
      operationId: getNcaafTotalsResearchSlate
      summary: Fetch an immutable page from the weekly research slate
      parameters:
      - name: slate_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9]{4}_[0-9]{2}$
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 20
          default: 8
      - name: revision
        in: query
        schema:
          type: string
          pattern: ^[a-f0-9]{16}$
      responses:
        '200':
          description: Research page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlatePage'
        '409':
          description: Revision changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/model/qbase:
    get:
      operationId: getNcaafTotalsQbase
      summary: Retrieve calibrated market-blind QBASE artifact
      responses:
        '200':
          description: QBASE artifact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Qbase'
  /v1/qbase/{slate_id}:
    get:
      operationId: getNcaafTotalsQbaseSlate
      summary: Fetch an immutable page of aligned QBASE outputs
      parameters:
      - name: slate_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9]{4}_[0-9]{2}$
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 20
          default: 6
      - name: revision
        in: query
        schema:
          type: string
          pattern: ^[a-f0-9]{16}$
      responses:
        '200':
          description: QBASE page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QbaseSlatePage'
        '409':
          description: QBASE revision changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/freeze-runs:
    post:
      operationId: startNcaafTotalsFreezeRun
      summary: Start a revision-locked, resumable research run; does not freeze.
      description: 'Start a revision-locked, resumable research run; does not freeze.
        Market-blind: never retrieves sportsbook data.'
      parameters: []
      responses:
        '200':
          description: Verified response; inspect status and every mandatory receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FreezeResponse'
        '422':
          description: Fail-closed integrity/research failure; no new freeze.
        '503':
          description: Service unavailable; no freeze.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                season:
                  type: integer
                week:
                  type: integer
                window_start:
                  type: string
                  format: date-time
                window_end:
                  type: string
                  format: date-time
                timing_mode:
                  type: string
                  enum:
                  - NIGHT-BEFORE
                  - MATCHDAY
              required:
              - season
              - week
              - window_start
              - window_end
              - timing_mode
      x-openai-isConsequential: false
  /v1/freeze-runs/{run_id}:
    get:
      operationId: getNcaafTotalsFreezeRun
      summary: Read completion, pending game IDs and immutable freeze receipt.
      description: 'Read completion, pending game IDs and immutable freeze receipt.
        Market-blind: never retrieves sportsbook data.'
      parameters:
      - &id001
        name: run_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{64}$
      responses:
        '200':
          description: Verified response; inspect status and every mandatory receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FreezeResponse'
        '422':
          description: Fail-closed integrity/research failure; no new freeze.
        '503':
          description: Service unavailable; no freeze.
  /v1/freeze-runs/{run_id}/research:
    get:
      operationId: getNcaafTotalsFreezeResearch
      summary: Read five eligible research records and compact keyed QBASE anchors.
      description: 'Read five eligible research records and compact keyed QBASE anchors.
        Market-blind: never retrieves sportsbook data.'
      parameters:
      - *id001
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: Verified response; inspect status and every mandatory receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FreezeResponse'
        '422':
          description: Fail-closed integrity/research failure; no new freeze.
        '503':
          description: Service unavailable; no freeze.
    post:
      operationId: checkpointNcaafTotalsResearch
      summary: "Save 1\u20135 complete current-research and contextual receipts; never\
        \ freezes."
      description: "Save 1\u20135 complete current-research and contextual receipts;\
        \ never freezes. Market-blind: never retrieves sportsbook data."
      parameters:
      - *id001
      responses:
        '200':
          description: Verified response; inspect status and every mandatory receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FreezeResponse'
        '422':
          description: Fail-closed integrity/research failure; no new freeze.
        '503':
          description: Service unavailable; no freeze.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                contexts:
                  type: array
                  items:
                    $ref: '#/components/schemas/FreezeContext'
                  minItems: 1
                  maxItems: 5
              required:
              - contexts
      x-openai-isConsequential: false
  /v1/freeze-runs/{run_id}/compute:
    post:
      operationId: computeNcaafTotalsFreeze
      summary: Execute all-game identity and numerical audits; atomically persist
        whole-slate freeze. Idempotent retries return the original freeze.
      description: 'Execute all-game identity and numerical audits; atomically persist
        whole-slate freeze. Idempotent retries return the original freeze. Market-blind:
        never retrieves sportsbook data.'
      parameters:
      - *id001
      responses:
        '200':
          description: Verified response; inspect status and every mandatory receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FreezeResponse'
        '422':
          description: Fail-closed integrity/research failure; no new freeze.
        '503':
          description: Service unavailable; no freeze.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
              required: []
      x-openai-isConsequential: false
  /v1/freeze-runs/{run_id}/games/{game_id}:
    get:
      operationId: getNcaafTotalsFrozenGame
      summary: Read the exact persisted frozen game and full grid; never recompute.
      description: 'Read the exact persisted frozen game and full grid; never recompute.
        Market-blind: never retrieves sportsbook data.'
      parameters:
      - *id001
      - name: game_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Verified response; inspect status and every mandatory receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FreezeResponse'
        '422':
          description: Fail-closed integrity/research failure; no new freeze.
        '503':
          description: Service unavailable; no freeze.
components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        slate_id:
          type: string
        qbase_revision:
          type: string
      additionalProperties: true
    Health:
      type: object
      properties:
        ok:
          type: boolean
        service:
          type: string
        version:
          type: string
        market_data:
          type: boolean
        slate_count:
          type: integer
        fixture_count:
          type: integer
        source_health:
          type: object
          additionalProperties: true
        freshness:
          type: object
          additionalProperties: true
      additionalProperties: true
    SlateEntry:
      type: object
      properties:
        slate_id:
          type: string
        season:
          type: integer
        week:
          type: integer
        pack_revision:
          type: string
        game_count:
          type: integer
        current_season_data_through_week:
          type:
          - integer
          - 'null'
      additionalProperties: true
    TeamProfile:
      type: object
      properties:
        team_id:
          type: string
        team_name:
          type: string
        current:
          type: object
          additionalProperties: true
        prior_season:
          type: object
          additionalProperties: true
        preseason:
          type: object
          additionalProperties: true
      additionalProperties: true
    Game:
      type: object
      required:
      - game_id
      - fixture
      properties:
        game_id:
          type: string
        fixture:
          type: object
          additionalProperties: true
        home_profile:
          $ref: '#/components/schemas/TeamProfile'
        away_profile:
          $ref: '#/components/schemas/TeamProfile'
      additionalProperties: true
    Pagination:
      type: object
      properties:
        offset:
          type: integer
        returned:
          type: integer
        total_games:
          type: integer
        next_offset:
          type:
          - integer
          - 'null'
        revision:
          type: string
      additionalProperties: true
    SlatePage:
      type: object
      properties:
        schema_version:
          type: string
        slate_id:
          type: string
        pack_revision:
          type: string
        season:
          type: integer
        week:
          type: integer
        market_data:
          type: boolean
        data_state:
          type: object
          additionalProperties: true
        source_health:
          type: object
          additionalProperties: true
        limitations:
          type: array
          items:
            type: string
        games:
          type: array
          items:
            $ref: '#/components/schemas/Game'
        pagination:
          $ref: '#/components/schemas/Pagination'
      additionalProperties: true
    Qbase:
      type: object
      properties:
        model_name:
          type: string
        model_version:
          type: string
        market_data:
          type: boolean
        features:
          type: array
          items:
            type: string
        coefficients:
          type: array
          items:
            type: number
        walk_forward:
          type: object
          additionalProperties: true
      additionalProperties: true
    ProbabilityRow:
      type: object
      required:
      - line
      - over
      - push
      - under
      properties:
        line:
          type: number
        over:
          type: number
          minimum: 0
          maximum: 1
        push:
          type: number
          minimum: 0
          maximum: 1
        under:
          type: number
          minimum: 0
          maximum: 1
      additionalProperties: false
    QbaseGame:
      type: object
      required:
      - game_id
      - home_team
      - away_team
      - expected_total_qbase
      - residual_bucket
      - residual_sd
      - qbase_anchor_sha256
      - probability_grid
      properties:
        game_id:
          type: string
        home_team:
          type: string
        away_team:
          type: string
        expected_total_raw:
          type: number
        oos_bias_calibration:
          type: number
        expected_total_qbase:
          type: number
        residual_bucket:
          type: string
        residual_sd:
          type: number
        missing_feature_count_before_imputation:
          type: integer
        qbase_anchor_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        probability_grid:
          type: array
          items:
            $ref: '#/components/schemas/ProbabilityRow'
      additionalProperties: true
    QbaseSlatePage:
      type: object
      properties:
        schema_version:
          type: string
        probability_schema_version:
          type: string
        integer_line_method:
          type: string
        identity_binding:
          type: string
        market_data:
          type: boolean
        slate_id:
          type: string
        season:
          type: integer
        week:
          type: integer
        research_pack_revision:
          type: string
        qbase_model_name:
          type: string
        qbase_model_version:
          type: string
        qbase_model_sha256:
          type: string
        qbase_revision:
          type: string
        supported_total_grid:
          type: object
          additionalProperties: true
        games:
          type: array
          items:
            $ref: '#/components/schemas/QbaseGame'
        pagination:
          $ref: '#/components/schemas/Pagination'
      additionalProperties: true
    Evidence:
      type: object
      additionalProperties: false
      properties:
        finding:
          type: string
        checked_at:
          type: string
          format: date-time
        sources:
          type: array
          items:
            type: string
            format: uri
          minItems: 1
        unresolved:
          type: boolean
      required:
      - finding
      - checked_at
      - sources
      - unresolved
    ResearchReceipt:
      type: object
      additionalProperties: false
      properties:
        market_data:
          type: boolean
          enum:
          - false
        home_team:
          type: string
        away_team:
          type: string
        home:
          type: object
          additionalProperties: false
          properties:
            qb_backup:
              $ref: '#/components/schemas/Evidence'
            offensive_line:
              $ref: '#/components/schemas/Evidence'
            skill_defense_absences:
              $ref: '#/components/schemas/Evidence'
            coaching_playcaller:
              $ref: '#/components/schemas/Evidence'
            transfers_depth:
              $ref: '#/components/schemas/Evidence'
            suspensions:
              $ref: '#/components/schemas/Evidence'
            rest_travel:
              $ref: '#/components/schemas/Evidence'
            late_news:
              $ref: '#/components/schemas/Evidence'
          required:
          - qb_backup
          - offensive_line
          - skill_defense_absences
          - coaching_playcaller
          - transfers_depth
          - suspensions
          - rest_travel
          - late_news
        away:
          type: object
          additionalProperties: false
          properties:
            qb_backup:
              $ref: '#/components/schemas/Evidence'
            offensive_line:
              $ref: '#/components/schemas/Evidence'
            skill_defense_absences:
              $ref: '#/components/schemas/Evidence'
            coaching_playcaller:
              $ref: '#/components/schemas/Evidence'
            transfers_depth:
              $ref: '#/components/schemas/Evidence'
            suspensions:
              $ref: '#/components/schemas/Evidence'
            rest_travel:
              $ref: '#/components/schemas/Evidence'
            late_news:
              $ref: '#/components/schemas/Evidence'
          required:
          - qb_backup
          - offensive_line
          - skill_defense_absences
          - coaching_playcaller
          - transfers_depth
          - suspensions
          - rest_travel
          - late_news
        game:
          type: object
          additionalProperties: false
          properties:
            schedule_status:
              $ref: '#/components/schemas/Evidence'
            venue_roof_surface:
              $ref: '#/components/schemas/Evidence'
            weather:
              $ref: '#/components/schemas/Evidence'
          required:
          - schedule_status
          - venue_roof_surface
          - weather
        deep_triggers:
          type: array
          items:
            type: string
        deep_evidence:
          type: array
          items:
            $ref: '#/components/schemas/Evidence'
      required:
      - market_data
      - home_team
      - away_team
      - home
      - away
      - game
      - deep_triggers
      - deep_evidence
    FreezeContext:
      type: object
      additionalProperties: false
      properties:
        game_id:
          type: string
        contextual_shift:
          type: number
        distribution_changed:
          type: boolean
        confidence:
          type: string
          enum:
          - A
          - A-
          - B+
          - B
          - B-
          - C+
          - C
          - D
        fragility:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
        frozen_thesis:
          type: string
        research:
          $ref: '#/components/schemas/ResearchReceipt'
        ledger:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              id:
                type: string
              evidence:
                $ref: '#/components/schemas/Evidence'
              pathway:
                type: string
              impact:
                type: string
              quantified_basis:
                type: string
            required:
            - id
            - evidence
            - pathway
            - impact
            - quantified_basis
        scenarios:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              id:
                type: string
              weight:
                type: number
                exclusiveMinimum: 0
                maximum: 1
              shift:
                type: number
              residual_scale:
                type: number
                exclusiveMinimum: 0
              ledger_ids:
                type: array
                items:
                  type: string
            required:
            - id
            - weight
            - shift
            - residual_scale
            - ledger_ids
          minItems: 1
          maxItems: 8
      required:
      - game_id
      - contextual_shift
      - distribution_changed
      - confidence
      - fragility
      - frozen_thesis
      - research
      - ledger
      - scenarios
    FreezeResponse:
      type: object
      properties:
        run_id:
          type: string
        market_data:
          type: boolean
          enum:
          - false
        p_model_status:
          type: string
        freeze_receipt_sha256:
          type: string
        identity_receipt_sha256:
          type: string
        frozen_at:
          type: string
          format: date-time
        games:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true
