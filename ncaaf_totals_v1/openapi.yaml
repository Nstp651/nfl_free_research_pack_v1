openapi: 3.1.0
info:
  title: NCAA Totals Research Pack
  version: 0.1.0
  description: >-
    Read-only, pre-market NCAA Football FBS-v-FBS research service. Retrieve the
    complete target-week slate at one immutable revision before building P_model.
    No odds, sportsbook prices, consensus lines or betting data are returned.
servers:
  - url: https://ncaaf-totals-research-pack-v1.nickarnott01.workers.dev
paths:
  /health:
    get:
      operationId: healthNcaafTotalsResearchPack
      summary: Check research-pack freshness and source health
      responses:
        '200':
          description: Healthy research service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Stale or incomplete research service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/slates:
    get:
      operationId: listNcaafTotalsResearchSlates
      summary: Resolve the published NCAA research slate for a season and week
      parameters:
        - name: season
          in: query
          required: true
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
        - name: week
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 30
      responses:
        '200':
          description: Matching slate manifest entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema_version: { type: string }
                  market_data: { type: boolean }
                  season: { type: integer }
                  week: { type: integer }
                  slates:
                    type: array
                    items:
                      $ref: '#/components/schemas/SlateEntry'
                  source_health:
                    type: object
                    additionalProperties: true
                  freshness:
                    type: object
                    additionalProperties: true
                  limitations:
                    type: array
                    items: { type: string }
                additionalProperties: true
  /v1/slates/{slate_id}:
    get:
      operationId: getNcaafTotalsResearchSlate
      summary: Fetch one page of games from an immutable NCAA weekly research slate
      description: >-
        Start at offset 0. Follow pagination.next_offset until null. Pass the same
        revision on every request. Never combine pages from different revisions.
        On 409 or snapshot mismatch, discard all pages and restart once from the
        manifest.
      parameters:
        - name: slate_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]{4}_[0-9]{2}$'
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 8
        - name: revision
          in: query
          required: false
          schema:
            type: string
            pattern: '^[a-f0-9]{16}$'
      responses:
        '200':
          description: One page of the weekly research slate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlatePage'
        '409':
          description: Research revision changed; restart retrieval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Upstream source or schema validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Snapshot updating or stale
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
        slate_id: { type: string }
      additionalProperties: true
    Health:
      type: object
      properties:
        ok: { type: boolean }
        service: { type: string }
        version: { type: string }
        market_data: { type: boolean }
        slate_count: { type: integer }
        fixture_count: { type: integer }
        source_health:
          type: object
          additionalProperties: true
        freshness:
          type: object
          additionalProperties: true
      additionalProperties: true
    SlateEntry:
      type: object
      properties:
        slate_id: { type: string }
        season: { type: integer }
        week: { type: integer }
        pack_revision: { type: string }
        game_count: { type: integer }
        current_season_data_through_week:
          type: [integer, 'null']
      additionalProperties: true
    TeamProfile:
      type: object
      properties:
        team_id: { type: string }
        team_name: { type: string }
        current:
          type: object
          additionalProperties: true
        prior_season:
          type: object
          additionalProperties: true
        preseason:
          type: object
          additionalProperties: true
      additionalProperties: true
    Game:
      type: object
      properties:
        game_id: { type: string }
        fixture:
          type: object
          additionalProperties: true
        home_profile:
          $ref: '#/components/schemas/TeamProfile'
        away_profile:
          $ref: '#/components/schemas/TeamProfile'
      additionalProperties: true
    SlatePage:
      type: object
      properties:
        schema_version: { type: string }
        slate_id: { type: string }
        pack_revision: { type: string }
        season: { type: integer }
        week: { type: integer }
        market_data: { type: boolean }
        data_state:
          type: object
          additionalProperties: true
        source_health:
          type: object
          additionalProperties: true
        source_receipt:
          type: object
          additionalProperties: true
        limitations:
          type: array
          items: { type: string }
        games:
          type: array
          items:
            $ref: '#/components/schemas/Game'
        pagination:
          type: object
          properties:
            offset: { type: integer }
            returned: { type: integer }
            total_games: { type: integer }
            next_offset:
              type: [integer, 'null']
            revision: { type: string }
          additionalProperties: true
      additionalProperties: true
