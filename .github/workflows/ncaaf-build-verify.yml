name: Verify NCAA live-source build

on:
  push:
    branches: [feature/ncaaf-totals-v1, main]
    paths:
      - 'ncaaf_totals_v1/build_pack.py'
      - 'ncaaf_totals_v1/build_pack_entry.py'
      - 'ncaaf_totals_v1/validate_pack.py'
      - 'ncaaf_totals_v1/requirements.txt'
      - '.github/workflows/ncaaf-build-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ncaaf_totals_v1/requirements.txt
      - run: python -m pip install -r ncaaf_totals_v1/requirements.txt
      - name: Build real current NCAA slate from public releases
        working-directory: ncaaf_totals_v1
        run: python build_pack_entry.py --season 2026 --week auto --output /tmp/ncaaf-data
      - name: Validate real build
        run: python ncaaf_totals_v1/validate_pack.py --data /tmp/ncaaf-data
      - name: Acceptance summary
        run: |
          python - <<'PY'
          import json
          m=json.load(open('/tmp/ncaaf-data/manifest.json'))
          s=m['slates'][0]
          print('REAL_SOURCE_ACCEPTANCE=PASS')
          print('slate_id=',s['slate_id'])
          print('pack_revision=',s['pack_revision'])
          print('game_count=',s['game_count'])
          print('through_week=',s.get('current_season_data_through_week'))
          print('source_health=',m['source_health']['status'])
          print('limitations=',m.get('limitations',[]))
          PY
