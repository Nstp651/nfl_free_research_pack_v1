name: Verify NCAA totals market Worker source

# Cloudflare native Git integration owns production deployment. The market
# project's Cloudflare build secret installs ODDS_API_KEY as a runtime Worker
# secret in its deploy command. GitHub never stores the Odds API key.
on:
  push:
    branches: [main, feature/ncaaf-totals-v1, feature/ncaaf-integer-totals-v1.1]
    paths:
      - 'ncaaf_totals_v1/market_worker/**'
      - 'ncaaf_totals_v1/market_openapi*.yaml'
      - '.github/workflows/ncaaf-market-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ncaaf-market-worker-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Contract tests
        working-directory: ncaaf_totals_v1/market_worker
        run: node --test index.test.mjs
      - name: Action contract sanity
        shell: bash
        run: |
          grep -q 'operationId: getNcaafTotalsBoard' ncaaf_totals_v1/market_openapi_v1_1.yaml
          grep -q 'ncaaf-totals-market-v1.nickarnott01.workers.dev' ncaaf_totals_v1/market_openapi_v1_1.yaml
          grep -q "region: 'au'" ncaaf_totals_v1/market_worker/index.js
          grep -q "markets: 'totals'" ncaaf_totals_v1/market_worker/index.js
          grep -q 'name = "ncaaf-totals-market-v1"' ncaaf_totals_v1/market_worker/wrangler.toml
      - name: Wrangler dry run
        working-directory: ncaaf_totals_v1/market_worker
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes wrangler@4.128.0 deploy --dry-run --outdir /tmp/ncaaf-market-worker --config wrangler.toml
      - name: Deployment ownership receipt
        run: echo 'Cloudflare Git integration is the production deployment owner; live board acceptance is manual-only.'
