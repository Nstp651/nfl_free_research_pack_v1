name: Verify and deploy NCAA totals research Worker

on:
  workflow_dispatch:
  push:
    branches: [main, feature/ncaaf-totals-v1]
    paths:
      - 'ncaaf_totals_v1/worker/**'
      - 'ncaaf_totals_v1/wrangler.toml'
      - 'ncaaf_totals_v1/openapi.yaml'
      - 'ncaaf_totals_v1/data/**'
      - '.github/workflows/ncaaf-worker-deploy.yml'

permissions:
  contents: read

concurrency:
  group: ncaaf-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Worker unit tests
        working-directory: ncaaf_totals_v1
        run: node --test worker/index.test.mjs
      - name: Wrangler dry run
        working-directory: ncaaf_totals_v1
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes wrangler@4.128.0 deploy --dry-run --outdir /tmp/ncaaf-worker --config wrangler.toml

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check Cloudflare credentials are configured
        id: cf
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Cloudflare secrets are not configured; verification passed but deploy is skipped.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy dedicated NCAA Worker
        if: steps.cf.outputs.ready == 'true'
        working-directory: ncaaf_totals_v1
        run: npx --yes wrangler@4.128.0 deploy --config wrangler.toml
      - name: Smoke-test live Worker
        if: steps.cf.outputs.ready == 'true'
        shell: bash
        run: |
          URL='https://ncaaf-totals-research-pack-v1.nickarnott01.workers.dev/health'
          for i in 1 2 3 4 5; do
            if curl --fail --silent --show-error "$URL" > /tmp/health.json; then break; fi
            sleep 5
          done
          python - <<'PY'
          import json
          h=json.load(open('/tmp/health.json'))
          assert h.get('service') == 'NCAAF_TOTALS_RESEARCH_PACK', h
          assert h.get('market_data') is False, h
          print(json.dumps(h, indent=2))
          PY
