name: Verify NCAA totals research Worker source

# Cloudflare native Git integration owns production deployment. This workflow
# only verifies the source package so GitHub and Cloudflare cannot race or
# require duplicate deployment credentials.
on:
  workflow_dispatch:
  push:
    branches: [main, feature/ncaaf-totals-v1, feature/ncaaf-integer-totals-v1.1]
    paths:
      - 'ncaaf_totals_v1/worker/**'
      - 'ncaaf_totals_v1/wrangler.toml'
      - 'ncaaf_totals_v1/openapi*.yaml'
      - 'ncaaf_totals_v1/data/**'
      - 'ncaaf_totals_v1/model/slates/**'
      - '.github/workflows/ncaaf-worker-deploy.yml'

permissions:
  contents: read

concurrency:
  group: ncaaf-worker-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python -m pip install -r ncaaf_totals_v1/model/requirements.txt
      - name: Worker unit tests
        working-directory: ncaaf_totals_v1
        run: node --test worker/index.test.mjs worker/freeze_core.test.mjs worker/freeze_run.test.mjs
      - name: Wrangler dry run
        working-directory: ncaaf_totals_v1
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes wrangler@4.128.0 deploy --dry-run --outdir /tmp/ncaaf-worker --config wrangler.toml
      - name: Verify production URL contract
        shell: bash
        run: |
          grep -q 'ncaaf-totals-research-pack-v1.nickarnott01.workers.dev' ncaaf_totals_v1/openapi_v1_1.yaml
          grep -q 'name = "ncaaf-totals-research-pack-v1"' ncaaf_totals_v1/wrangler.toml
          echo 'Cloudflare Git integration is the production deployment owner.'
