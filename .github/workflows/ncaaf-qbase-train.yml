name: Train NCAA totals QBASE

on:
  push:
    branches: [feature/ncaaf-totals-v1]
    paths:
      - 'ncaaf_totals_v1/model/train_qbase.py'
      - 'ncaaf_totals_v1/model/requirements.txt'
      - '.github/workflows/ncaaf-qbase-train.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ncaaf-qbase-train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ncaaf_totals_v1/model/requirements.txt
      - name: Install model dependencies
        run: python -m pip install -r ncaaf_totals_v1/model/requirements.txt
      - name: Train and temporal-walk-forward score
        working-directory: ncaaf_totals_v1
        run: |
          python model/train_qbase.py \
            --start 2016 --end 2025 \
            --cache /tmp/ncaaf-qbase-cache \
            --output model/qbase_v0.1.0.json \
            --report model/QBASE_BACKTEST.md
      - name: Verify artifact is market blind and finite
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          p=Path('ncaaf_totals_v1/model/qbase_v0.1.0.json')
          a=json.loads(p.read_text())
          assert a['market_data'] is False
          assert a['training_games'] > 1000
          assert a['walk_forward']['overall']['n'] > 500
          assert math.isfinite(a['walk_forward']['overall']['mae'])
          assert len(a['features']) == len(a['coefficients'])
          txt=p.read_text().lower()
          for forbidden in ('sportsbook_odds','market_price','consensus_total'):
              assert forbidden not in txt
          print(json.dumps(a['walk_forward']['overall'], indent=2))
          PY
      - name: Commit calibrated artifact and audit report
        shell: bash
        run: |
          git config user.name 'ncaaf-model-bot'
          git config user.email 'ncaaf-model-bot@users.noreply.github.com'
          git add ncaaf_totals_v1/model/qbase_v0.1.0.json ncaaf_totals_v1/model/QBASE_BACKTEST.md
          if git diff --cached --quiet; then
            echo 'QBASE artifact unchanged.'
            exit 0
          fi
          git commit -m 'Calibrate NCAA totals QBASE v0.1.0'
          git push origin 'HEAD:feature/ncaaf-totals-v1'
