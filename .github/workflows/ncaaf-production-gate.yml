name: NCAA totals production gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'ncaaf_totals_v1/**'
      - '.github/workflows/ncaaf-*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ncaaf-production-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            ncaaf_totals_v1/requirements.txt
            ncaaf_totals_v1/model/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r ncaaf_totals_v1/model/requirements.txt pytest==8.4.2 PyYAML==6.0.3

      - name: Python contract tests
        working-directory: ncaaf_totals_v1
        run: pytest -q tests

      - name: Build and validate real 2026 Week 1 research pack
        working-directory: ncaaf_totals_v1
        run: |
          python build_pack_entry.py --season 2026 --week 1 --output /tmp/ncaaf-gate-data
          python validate_pack.py --data /tmp/ncaaf-gate-data

      - name: Score real pack with frozen QBASE artifact and identity hashes
        working-directory: ncaaf_totals_v1
        run: |
          python model/score_slate.py --data /tmp/ncaaf-gate-data --artifact model/qbase_v0.1.0.json --output-root /tmp/ncaaf-gate-qbase
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'model')
          from freeze_identity import qbase_anchor_sha256
          files=list(Path('/tmp/ncaaf-gate-qbase').glob('*/*.json'))
          assert len(files)==1, files
          x=json.loads(files[0].read_text())
          assert x['schema_version'] == '0.1.0'
          assert x['probability_schema_version'] == '0.2.0'
          assert x['integer_line_method'] == 'continuity_corrected_discrete_mass'
          assert x['identity_binding'] == 'exact_game_id_plus_qbase_anchor_sha256'
          assert x['market_data'] is False and x['games']
          assert len(x['research_pack_revision']) == 16 and len(x['qbase_revision']) == 16
          ids=[str(g['game_id']) for g in x['games']]
          assert len(ids)==len(set(ids)), 'duplicate QBASE game_id'
          meta=x['supported_total_grid']
          assert meta['min'] <= 20.0 and meta['max'] >= 100.5 and abs(meta['step']-0.5)<1e-12
          for g in x['games']:
              assert len(g['qbase_anchor_sha256']) == 64
              assert g['qbase_anchor_sha256'] == qbase_anchor_sha256(g)
              grid=g['probability_grid']; assert grid
              assert all(0 <= r['over'] <= 1 and 0 <= r['push'] <= 1 and 0 <= r['under'] <= 1 for r in grid)
              assert all(abs(r['over']+r['push']+r['under']-1)<3e-8 for r in grid)
              assert all(grid[i+1]['over'] <= grid[i]['over']+1e-10 for i in range(len(grid)-1))
              assert all(grid[i+1]['under'] >= grid[i]['under']-1e-10 for i in range(len(grid)-1))
              ints=[r for r in grid if abs(r['line']-round(r['line']))<1e-9]
              halves=[r for r in grid if abs(r['line']-round(r['line']))>=1e-9]
              assert ints and halves and any(r['push']>0 for r in ints)
              assert all(abs(r['push'])<1e-12 for r in halves)
          print('QBASE_V1_1_2_IDENTITY_ACCEPTANCE=PASS', files[0])
          PY

      - name: Market-boundary and V1.1.2 custom-GPT gates
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          inst=Path('ncaaf_totals_v1/GPT_INSTRUCTIONS_PRODUCTION_V1.1.2.md').read_text()
          master=Path('ncaaf_totals_v1/NCAA_TOTALS_4_LAYER_MASTER_API_ACTION_PRODUCTION_V1.1.2.md').read_text()
          market_schema=Path('ncaaf_totals_v1/market_openapi_v1_1.yaml').read_text()
          assert len(inst) < 8000, len(inst)
          for token in ('P_MODEL_STATUS: FROZEN','getNcaafTotalsBoard','qbase_anchor_sha256','IDENTITY_BINDING_AUDIT','game_id'):
              assert token in inst, token
          for token in ('qbase_anchor_sha256','identity_receipt_sha256','Zero-shift','game_id'):
              assert token in master, token
          assert 'operationId: getNcaafTotalsBoard' in market_schema
          schema=json.loads(Path('ncaaf_totals_v1/model/frozen_pmodel_schema_v1_1_2.json').read_text())
          assert schema['properties']['schema_version']['const']=='1.1.2'
          m=json.loads(Path('/tmp/ncaaf-gate-data/manifest.json').read_text())
          assert m['market_data'] is False
          slate=next(Path('/tmp/ncaaf-gate-data/slates').glob('*/*.json'))
          deny=re.compile(r'"(?:odds|spread|moneyline|betting|sportsbook|bookmaker|over_under|total_line|line_price)"\s*:', re.I)
          assert not deny.search(slate.read_text()), 'market-like key entered research pack'
          print('INSTRUCTION_CHARS=',len(inst))
          print('NCAAF_V1_1_2_FREEZE_IDENTITY_GATE=PASS')
          PY

      - name: Research Worker contract + dry run
        working-directory: ncaaf_totals_v1
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          node --test worker/index.test.mjs worker/freeze_core.test.mjs worker/freeze_run.test.mjs
          npx --yes wrangler@4.128.0 deploy --dry-run --outdir /tmp/ncaaf-research-worker --config wrangler.toml

      - name: Market Worker contract + dry run
        working-directory: ncaaf_totals_v1/market_worker
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          node --test index.test.mjs
          npx --yes wrangler@4.128.0 deploy --dry-run --outdir /tmp/ncaaf-market-worker --config wrangler.toml

      - name: V1.1.3 replacement and residual bundle contracts
        run: |
          python ncaaf_totals_v1/tools/build_residual_bundle.py
          git diff --exit-code -- ncaaf_totals_v1/worker/residual_bundle.js
          python - <<'PYCODE'
          from pathlib import Path
          import yaml
          p=Path('ncaaf_totals_v1')
          assert len((p/'GPT_INSTRUCTIONS_PRODUCTION_V1.1.3.md').read_text())<8000
          spec=yaml.safe_load((p/'openapi_v1_1_3.yaml').read_text())
          ops=[op.get('operationId') for path in spec['paths'].values() for op in path.values() if isinstance(op,dict)]
          assert len(ops)==len(set(ops)) and 'computeNcaafTotalsFreeze' in ops
          print('V1_1_3_REPLACEMENT_GATE_PASS')
          PYCODE

      - name: Gate summary
        run: |
          echo 'NCAAF_V1_1_2_PRODUCTION_CODE_GATE=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Exact game_id + per-game QBASE anchor hashes are mandatory before freeze.' >> "$GITHUB_STEP_SUMMARY"
