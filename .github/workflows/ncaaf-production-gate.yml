name: NCAA totals production gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'ncaaf_totals_v1/**'
      - '.github/workflows/ncaaf-*.yml'
  push:
    branches: [feature/ncaaf-totals-v1]
    paths:
      - 'ncaaf_totals_v1/**'
      - '.github/workflows/ncaaf-production-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ncaaf-production-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            ncaaf_totals_v1/requirements.txt
            ncaaf_totals_v1/model/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r ncaaf_totals_v1/model/requirements.txt

      - name: Python contract tests
        working-directory: ncaaf_totals_v1
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Build and validate real 2026 Week 1 research pack
        working-directory: ncaaf_totals_v1
        run: |
          python build_pack_entry.py --season 2026 --week 1 --output /tmp/ncaaf-gate-data
          python validate_pack.py --data /tmp/ncaaf-gate-data

      - name: Score real pack with frozen QBASE artifact
        working-directory: ncaaf_totals_v1
        run: |
          python model/score_slate.py --data /tmp/ncaaf-gate-data --artifact model/qbase_v0.1.0.json --output-root /tmp/ncaaf-gate-qbase
          python - <<'PY'
          import json
          from pathlib import Path
          files=list(Path('/tmp/ncaaf-gate-qbase').glob('*/*.json'))
          assert len(files)==1, files
          x=json.loads(files[0].read_text())
          assert x['market_data'] is False
          assert len(x['games']) > 0
          assert len(x['research_pack_revision']) == 16
          assert len(x['qbase_revision']) == 16
          for g in x['games']:
              grid=g['probability_grid']
              assert grid
              assert all(0 <= r['over'] <= 1 and 0 <= r['under'] <= 1 for r in grid)
              assert all(abs(r['over'] + r['under'] - 1) < 2e-8 for r in grid)
              assert all(grid[i+1]['over'] <= grid[i]['over'] + 1e-10 for i in range(len(grid)-1))
          print('QBASE_REAL_SLATE_ACCEPTANCE=PASS', files[0])
          PY

      - name: Market-boundary and custom-GPT instruction gates
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          inst=Path('ncaaf_totals_v1/GPT_INSTRUCTIONS_PRODUCTION_V1.0.md').read_text()
          assert len(inst) < 8000, len(inst)
          assert 'P_MODEL_STATUS: FROZEN' in inst
          assert 'getNcaafTotalsBoard' in inst
          assert 'POST-FREEZE ONLY' in inst
          m=json.loads(Path('/tmp/ncaaf-gate-data/manifest.json').read_text())
          assert m['market_data'] is False
          slate=next(Path('/tmp/ncaaf-gate-data/slates').glob('*/*.json'))
          raw=slate.read_text()
          deny=re.compile(r'"(?:odds|spread|moneyline|betting|sportsbook|bookmaker|over_under|total_line|line_price)"\s*:', re.I)
          assert not deny.search(raw), 'market-like key entered research pack'
          print('INSTRUCTION_CHARS=',len(inst))
          print('MARKET_BOUNDARY=PASS')
          PY

      - name: Research Worker contract + dry run
        working-directory: ncaaf_totals_v1
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          node --test worker/index.test.mjs
          npx --yes wrangler@4.128.0 deploy --dry-run --outdir /tmp/ncaaf-research-worker --config wrangler.toml

      - name: Market Worker contract + dry run
        working-directory: ncaaf_totals_v1/market_worker
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          node --test index.test.mjs
          npx --yes wrangler@4.128.0 deploy --dry-run --outdir /tmp/ncaaf-market-worker --config wrangler.toml

      - name: Gate summary
        run: |
          echo 'NCAAF_PRODUCTION_CODE_GATE=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'This gate validates code/data contracts only; live Cloudflare acceptance remains a separate post-merge deployment gate.' >> "$GITHUB_STEP_SUMMARY"
