name: Tennis V1 Data Integrity

on:
  push:
    branches: [main, tennis-v1-serve-return-simulator]
    paths:
      - 'tennis_v1/**'
      - '.github/workflows/tennis-v1-data-integrity.yml'
  pull_request:
    paths:
      - 'tennis_v1/**'
      - '.github/workflows/tennis-v1-data-integrity.yml'
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: 'Also run the 2021-current historical rebuild'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '37 1 * * *'

permissions:
  contents: read

concurrency:
  group: tennis-v1-data-integrity
  cancel-in-progress: false

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tennis_v1/requirements.txt
      - run: pip install -r tennis_v1/requirements.txt
      - name: Run Tennis V1 integrity tests
        env:
          PYTHONPATH: tennis_v1/src
        run: pytest -q tennis_v1/tests

  live-source-probe:
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tennis_v1/requirements.txt
      - run: pip install -r tennis_v1/requirements.txt
      - name: Retrieve current free sources with zero human files
        env:
          PYTHONPATH: tennis_v1/src
        run: |
          YEAR="$(date -u +%Y)"
          python tennis_v1/scripts/build_data_pack.py probe             --through-year "$YEAR"             --output /tmp/tennis-probe
      - name: Verify market-blind pack and expected fail-closed acceptance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('/tmp/tennis-probe/manifest.json').read_text())
          z=json.loads(Path('/tmp/tennis-probe/ZERO_UPLOAD_TEST.json').read_text())
          assert m['market_data'] is False, m
          assert z['results_ready'] is True, z
          assert z['serve_return_ready'] is False, z
          assert z['tpi_ready'] is False, z
          assert z['match_input_ready'] is False, z
          assert z['zero_upload_status'] == 'FAIL_SERVE_STATS_GAP', z
          print('TENNIS_RESULTS_INGESTION=PASS')
          print('TENNIS_MARKET_BLIND_GATE=PASS')
          print('ZERO_UPLOAD_TEST=FAIL_SERVE_STATS_GAP')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tennis-v1-zero-upload-diagnostics
          path: |
            /tmp/tennis-probe/manifest.json
            /tmp/tennis-probe/ZERO_UPLOAD_TEST.json
          retention-days: 30

  historical-rebuild:
    if: github.event_name == 'workflow_dispatch' && inputs.full_rebuild == true
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tennis_v1/requirements.txt
      - name: Rebuild 2021-current result history without local files
        env:
          PYTHONPATH: tennis_v1/src
        run: |
          YEAR="$(date -u +%Y)"
          python tennis_v1/scripts/build_data_pack.py rebuild             --through-year "$YEAR"             --output /tmp/tennis-history
      - uses: actions/upload-artifact@v4
        with:
          name: tennis-v1-historical-rebuild
          path: |
            /tmp/tennis-history/manifest.json
            /tmp/tennis-history/ZERO_UPLOAD_TEST.json
          retention-days: 30
