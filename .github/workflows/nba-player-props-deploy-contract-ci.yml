name: NBA Player Props Deploy Contract CI

on:
  push:
    branches: [feature/nba-player-props-v1]
    paths:
      - 'nba_player_props_v1/scripts/**'
      - 'nba_player_props_v1/POST_DEPLOY_PREFLIGHT.md'
      - 'nba_player_props_v1/INSTALL_PRODUCTION_V1.0.md'
      - 'nba_player_props_v1/PRODUCTION_ACCEPTANCE_PROMPT_V1.0.md'
      - 'nba_player_props_v1/GPT_INSTRUCTIONS_PRODUCTION_V1.0.md'
      - 'nba_player_props_v1/TRACKER_INTEGRATION_PRODUCTION_V1.0.md'
      - 'nba_player_props_v1/openapi_v1.yaml'
      - 'nba_player_props_v1/market_openapi_v1.yaml'
      - 'nba_player_props_v1/tracker_openapi_v1.yaml'
      - 'nba_player_props_v1/worker/wrangler.toml'
      - 'nba_player_props_v1/market_worker/wrangler.toml'
      - '.github/workflows/nba-player-props-deploy-contract-ci.yml'
  pull_request:
    paths:
      - 'nba_player_props_v1/scripts/**'
      - 'nba_player_props_v1/POST_DEPLOY_PREFLIGHT.md'
      - 'nba_player_props_v1/INSTALL_PRODUCTION_V1.0.md'
      - 'nba_player_props_v1/PRODUCTION_ACCEPTANCE_PROMPT_V1.0.md'
      - 'nba_player_props_v1/GPT_INSTRUCTIONS_PRODUCTION_V1.0.md'
      - 'nba_player_props_v1/TRACKER_INTEGRATION_PRODUCTION_V1.0.md'
      - 'nba_player_props_v1/openapi_v1.yaml'
      - 'nba_player_props_v1/market_openapi_v1.yaml'
      - 'nba_player_props_v1/tracker_openapi_v1.yaml'
      - 'nba_player_props_v1/worker/wrangler.toml'
      - 'nba_player_props_v1/market_worker/wrangler.toml'
      - '.github/workflows/nba-player-props-deploy-contract-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Preflight harness syntax
        run: node --check nba_player_props_v1/scripts/post_deploy_preflight.mjs
      - name: Preflight harness unit tests
        run: node --test nba_player_props_v1/scripts/*.test.mjs
      - name: OpenAPI 3.1 parse and ref resolution
        run: |
          npx --yes @redocly/cli@1.34.5 bundle nba_player_props_v1/openapi_v1.yaml -o /tmp/nba-research-openapi.yaml
          npx --yes @redocly/cli@1.34.5 bundle nba_player_props_v1/market_openapi_v1.yaml -o /tmp/nba-market-openapi.yaml
          npx --yes @redocly/cli@1.34.5 bundle nba_player_props_v1/tracker_openapi_v1.yaml -o /tmp/nba-tracker-openapi.yaml
          echo 'NBA_OPENAPI_BUNDLE=PASS'
      - name: Deployment contract sanity
        run: |
          grep -q 'EXPECTED_SOURCE_COMMIT' nba_player_props_v1/POST_DEPLOY_PREFLIGHT.md
          grep -q 'RESEARCH_MARKET_ACCESS_GRANT' nba_player_props_v1/POST_DEPLOY_PREFLIGHT.md
          grep -q 'SLATE_RUNS' nba_player_props_v1/worker/wrangler.toml
          grep -q 'MARKET_RUNS' nba_player_props_v1/market_worker/wrangler.toml
          grep -q 'RESEARCH_SERVICE' nba_player_props_v1/market_worker/wrangler.toml
          grep -q 'ODDS_API_REGIONS = "au"' nba_player_props_v1/market_worker/wrangler.toml
          grep -q 'tracker_openapi_v1.yaml' nba_player_props_v1/INSTALL_PRODUCTION_V1.0.md
      - name: Action authentication contract
        run: |
          for schema in nba_player_props_v1/openapi_v1.yaml nba_player_props_v1/market_openapi_v1.yaml; do
            grep -q '^security:$' "$schema"
            grep -q 'bearerAuth' "$schema"
            grep -q 'type: http' "$schema"
            grep -q 'scheme: bearer' "$schema"
          done
          grep -q 'type: apiKey' nba_player_props_v1/tracker_openapi_v1.yaml
          grep -q 'name: X-GPT-Action-Key' nba_player_props_v1/tracker_openapi_v1.yaml
          echo 'NBA_ACTION_AUTH_CONTRACT=PASS'
      - name: Tracker and manual quote integrity contract
        run: |
          python - <<'PY'
          from pathlib import Path
          tracker=Path('nba_player_props_v1/tracker_openapi_v1.yaml').read_text()
          model=tracker.split('operationId: createModelRun',1)[1].split('operationId: recordBet',1)[0]
          bet=tracker.split('operationId: recordBet',1)[1]
          assert 'x-openai-isConsequential: false' in model
          assert 'x-openai-isConsequential: true' in bet
          assert 'required: [request_id, sport, league, model_name, model_version, fixture, selections]' in tracker
          assert 'required: [request_id, bookmaker, bet_type, stake, accepted_odds, legs]' in tracker
          assert 'required: [selection_name, player_name, market_family, market_key, side, threshold, p_model, fair_odds, market_price_at_integration, market_bookmaker_at_integration, final_rank, final_play]' in tracker
          assert 'enum: [single]' in bet
          market=Path('nba_player_props_v1/market_openapi_v1.yaml').read_text()
          manual=market.split('ManualQuote:',1)[1].split('ManualRefreshRequest:',1)[0]
          assert 'anyOf:' in manual and 'required: [player_id]' in manual and 'required: [player_name]' in manual
          instructions=Path('nba_player_props_v1/GPT_INSTRUCTIONS_PRODUCTION_V1.0.md').read_text()
          assert 'If Layer 4 is `NO BET`, do not fabricate a selection and do not create a tracker model run.' in instructions
          print('NBA_TRACKER_AND_MANUAL_INTEGRITY=PASS')
          PY
      - name: Action endpoint ownership sanity
        run: |
          grep -q 'nba-player-props-research-v1.nickarnott01.workers.dev' nba_player_props_v1/openapi_v1.yaml
          grep -q 'nba-player-props-market-v1.nickarnott01.workers.dev' nba_player_props_v1/market_openapi_v1.yaml
          grep -q 'nick-betting-api.nickarnott01.workers.dev' nba_player_props_v1/tracker_openapi_v1.yaml
          echo 'NBA_DEPLOY_CONTRACT=PASS'
