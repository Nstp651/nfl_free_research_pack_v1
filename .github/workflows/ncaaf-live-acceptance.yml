name: NCAA live Worker acceptance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ncaaf-live-acceptance.yml'
      - 'ncaaf_totals_v1/worker/**'
      - 'ncaaf_totals_v1/wrangler.toml'
      - 'ncaaf_totals_v1/model/slates/**'
      - 'ncaaf_totals_v1/market_worker/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RESEARCH_URL: https://ncaaf-totals-research-pack-v1.nickarnott01.workers.dev
      MARKET_URL: https://ncaaf-totals-market-v1.nickarnott01.workers.dev
      MANIFEST_URL: https://raw.githubusercontent.com/Nstp651/nfl_free_research_pack_v1/main/ncaaf_totals_v1/data/manifest.json
    steps:
      - name: Resolve currently published slate
        id: target
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$MANIFEST_URL" > /tmp/manifest.json
          python3 - <<'PY' > /tmp/target.env
          import json
          m=json.load(open('/tmp/manifest.json'))
          assert m.get('market_data') is False, m
          slates=m.get('slates',[])
          assert len(slates)==1, slates
          s=slates[0]
          print(f"SEASON={int(s['season'])}")
          print(f"WEEK={int(s['week'])}")
          print(f"SLATE_ID={s['slate_id']}")
          print(f"PACK_REVISION={s['pack_revision']}")
          print(f"GAME_COUNT={int(s['game_count'])}")
          PY
          cat /tmp/target.env >> "$GITHUB_ENV"
          cat /tmp/target.env

      - name: Verify research Worker health, manifest entry and QBASE artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$RESEARCH_URL/health" > /tmp/research-health.json
          curl --fail --silent --show-error "$RESEARCH_URL/v1/slates?season=$SEASON&week=$WEEK" > /tmp/slates.json
          curl --fail --silent --show-error "$RESEARCH_URL/v1/model/qbase" > /tmp/qbase.json
          python3 - <<'PY'
          import json, os
          h=json.load(open('/tmp/research-health.json'))
          s=json.load(open('/tmp/slates.json'))
          q=json.load(open('/tmp/qbase.json'))
          assert h.get('ok') is True, h
          assert h.get('service') == 'NCAAF_TOTALS_RESEARCH_PACK', h
          assert h.get('market_data') is False, h
          assert s.get('market_data') is False, s
          assert s.get('season') == int(os.environ['SEASON']) and s.get('week') == int(os.environ['WEEK']), s
          assert len(s.get('slates', [])) == 1, s
          slate=s['slates'][0]
          assert slate.get('slate_id') == os.environ['SLATE_ID'], slate
          assert slate.get('pack_revision') == os.environ['PACK_REVISION'], slate
          assert slate.get('game_count') == int(os.environ['GAME_COUNT']), slate
          assert q.get('market_data') is False, q
          assert q.get('model_name') == 'Nick NCAA Totals QBASE', q
          assert q.get('model_version') == '0.1.0', q
          print('RESEARCH_HEADER_ACCEPTANCE_PASS')
          PY

      - name: Retrieve every research slate page at one revision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          base=os.environ['RESEARCH_URL'].rstrip('/')
          sid=os.environ['SLATE_ID']; rev=os.environ['PACK_REVISION']; expected=int(os.environ['GAME_COUNT'])
          offset=0; ids=[]
          while offset is not None:
              q=urllib.parse.urlencode({'offset':offset,'limit':20,'revision':rev})
              with urllib.request.urlopen(f'{base}/v1/slates/{sid}?{q}', timeout=20) as r:
                  page=json.load(r)
              assert page.get('market_data') is False, page
              assert page.get('pack_revision') == rev, page
              assert page.get('slate_id') == sid, page
              ids.extend(str(g['game_id']) for g in page.get('games',[]))
              p=page.get('pagination',{})
              assert p.get('revision') == rev, p
              offset=p.get('next_offset')
          assert len(ids)==expected, (len(ids),expected)
          assert len(set(ids))==expected, 'duplicate research game IDs'
          print(f'RESEARCH_PAGINATION_ACCEPTANCE_PASS games={len(ids)} revision={rev}')
          PY

      - name: Retrieve every V1.1 QBASE page and audit integer/half-point grid
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          base=os.environ['RESEARCH_URL'].rstrip('/')
          sid=os.environ['SLATE_ID']; pack_rev=os.environ['PACK_REVISION']; expected=int(os.environ['GAME_COUNT'])
          offset=0; qrev=None; ids=[]; integer_rows=half_rows=push_rows=0
          while offset is not None:
              params={'offset':offset,'limit':20}
              if qrev: params['revision']=qrev
              q=urllib.parse.urlencode(params)
              with urllib.request.urlopen(f'{base}/v1/qbase/{sid}?{q}', timeout=20) as r:
                  page=json.load(r)
              assert page.get('market_data') is False, page
              assert page.get('research_pack_revision') == pack_rev, page
              assert page.get('probability_schema_version') == '0.2.0', page
              assert page.get('integer_line_method') == 'continuity_corrected_discrete_mass', page
              meta=page.get('supported_total_grid',{})
              assert float(meta.get('step')) == 0.5 and float(meta.get('min')) <= 20 and float(meta.get('max')) >= 100.5, meta
              current=page.get('qbase_revision')
              if qrev is None: qrev=current
              assert current == qrev, (current,qrev)
              for g in page.get('games',[]):
                  ids.append(str(g['game_id']))
                  grid=g.get('probability_grid',[]); assert grid
                  prev_o=2.0; prev_u=-1.0
                  for row in grid:
                      line=float(row['line']); over=float(row['over']); push=float(row['push']); under=float(row['under'])
                      assert -1e-12 <= over <= 1+1e-12 and -1e-12 <= push <= 1+1e-12 and -1e-12 <= under <= 1+1e-12
                      assert abs(over+push+under-1) < 3e-8
                      assert over <= prev_o + 1e-10 and under >= prev_u - 1e-10
                      prev_o,prev_u=over,under
                      if abs(line-round(line)) < 1e-9:
                          integer_rows += 1
                          if push > 0: push_rows += 1
                      else:
                          half_rows += 1
                          assert abs(push) < 1e-12
              p=page.get('pagination',{}); assert p.get('revision') == qrev, p
              offset=p.get('next_offset')
          assert len(ids)==expected and len(set(ids))==expected, (len(ids),expected)
          assert integer_rows and half_rows and push_rows
          print(f'QBASE_V1_1_ACCEPTANCE_PASS games={len(ids)} revision={qrev} integer_rows={integer_rows} half_rows={half_rows} push_rows={push_rows}')
          PY

      - name: Verify market Worker secret/configuration health only
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$MARKET_URL/health" > /tmp/market-health.json
          python3 - <<'PY'
          import json
          h=json.load(open('/tmp/market-health.json'))
          assert h.get('ok') is True, h
          assert h.get('configured') is True, h
          assert h.get('service') == 'NCAAF_TOTALS_MARKET_GATEWAY', h
          assert h.get('sport_key') == 'americanfootball_ncaaf', h
          assert h.get('region') == 'au', h
          assert h.get('market_group') == 'ncaaf-totals', h
          assert h.get('market_key') == 'totals', h
          print('MARKET_HEALTH_ACCEPTANCE_PASS')
          PY

      - name: Confirm no market board was requested
        run: echo 'Live acceptance intentionally stops at market /health. No Odds API board request is made before a valid model freeze.'
