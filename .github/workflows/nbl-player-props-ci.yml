name: NBL Player Props CI

on:
  pull_request:
    paths:
      - 'nbl_player_props_v1/**'
      - '.github/workflows/nbl-player-props-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-source-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: nbl_player_props_v1/requirements.txt
      - name: Install dependencies
        run: pip install -r nbl_player_props_v1/requirements.txt
      - name: Unit tests
        run: pytest -q nbl_player_props_v1/tests
      - name: Compile Python
        run: python -m compileall -q nbl_player_props_v1
      - name: Live official NBL Rosetta acceptance
        working-directory: nbl_player_props_v1
        run: python source_acceptance.py --season-year 2026
      - name: Build historical assists/rebounds source table
        run: |
          python nbl_player_props_v1/historical/build_player_games.py \
            --output /tmp/nbl-player-games.csv.gz \
            --receipt /tmp/nbl-source-receipt.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/nbl-source-receipt.json').read_text())
          assert r['market_data'] is False
          assert r['rows'] > 1000
          assert r['players'] > 100
          assert r['matches'] > 100
          print('NBL_HISTORICAL_SOURCE_ACCEPTANCE=PASS', r['rows'], r['players'], r['matches'])
          PY
      - name: Upload historical schema receipt
        uses: actions/upload-artifact@v4
        with:
          name: nbl-source-receipt
          path: /tmp/nbl-source-receipt.json
