name: NBL V1 Feature Asset Promotion

on:
  push:
    branches: [feature/nbl-player-props-v1]
    paths:
      - '.github/workflows/nbl-player-props-feature-promote.yml'

permissions:
  contents: write

concurrency:
  group: nbl-v1-feature-asset-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nbl-player-props-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: nbl_player_props_v1/requirements.txt
      - name: Install dependencies
        run: pip install -r nbl_player_props_v1/requirements.txt
      - name: Integrity tests
        run: |
          pytest -q nbl_player_props_v1/tests
          python -m compileall -q nbl_player_props_v1
          node --test nbl_player_props_v1/worker/*.test.mjs
      - name: Build corrected market-blind historical source and prior
        run: |
          python nbl_player_props_v1/historical/build_player_games.py \
            --output /tmp/nbl-player-games.csv.gz \
            --receipt /tmp/nbl-source-receipt.json
          python nbl_player_props_v1/historical/build_prior_snapshot.py \
            --data /tmp/nbl-player-games.csv.gz \
            --source-receipt /tmp/nbl-source-receipt.json \
            --output /tmp/nbl-prior-snapshot.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/nbl-source-receipt.json').read_text())
          assert r['schema_version']=='0.1.9'
          assert r['market_data'] is False
          assert r['latest_season']=='2025-2026', r
          assert r['latest_season_rows'] > 500
          assert r['latest_season_match_time_non_null_rate'] >= .99
          assert r['latest_season_minutes_non_null_rate'] >= .99
          print('NBL_FEATURE_SOURCE_GATE=PASS',r['rows'],r['latest_season'],r['latest_season_rows'],r['latest_season_minutes_non_null_rate'])
          PY
      - name: Train and promotion-gate both QBASE heads through 2025-26
        run: |
          mkdir -p /tmp/nbl-model-artifacts /tmp/nbl-model-reports
          python nbl_player_props_v1/model/train_heads.py \
            --data /tmp/nbl-player-games.csv.gz \
            --source-receipt /tmp/nbl-source-receipt.json \
            --output-dir /tmp/nbl-model-artifacts \
            --report-dir /tmp/nbl-model-reports
          python - <<'PY'
          import json
          from pathlib import Path
          gates={
            'assists': {'mae':1.20,'rmse':1.75,'brier':.070,'early_mae':1.35},
            'rebounds':{'mae':1.95,'rmse':2.55,'brier':.085,'early_mae':2.15},
          }
          source=json.loads(Path('/tmp/nbl-source-receipt.json').read_text())
          latest=int(source['latest_season'].split('-')[0])
          for h,g in gates.items():
              a=json.loads(Path(f'/tmp/nbl-model-artifacts/qbase_{h}_v0.1.0.json').read_text())
              wf=a['walk_forward']; o=wf['overall']; early=wf['early_late']['SEASON_GAMES_0_2']
              assert a['market_data'] is False and a['stat_type']==h
              assert a['training_seasons'][1]==latest, (h,a['training_seasons'])
              assert wf['last_scored_season']==latest, (h,wf['last_scored_season'])
              assert o['n']>20000
              assert o['mae']<=g['mae'] and o['rmse']<=g['rmse']
              assert abs(o['bias_actual_minus_pred'])<=.15
              assert wf['brier_at_least']['mean']<=g['brier']
              assert early['mae']<=g['early_mae']
              assert wf['nb2_alpha_oos']>0
              print('NBL_FEATURE_QBASE_GATE=PASS',h,a['training_seasons'],wf['last_scored_season'],o,wf['brier_at_least']['mean'],early)
          PY
      - name: Publish coherent immutable runtime asset set
        run: |
          python nbl_player_props_v1/publish_assets.py \
            --assists /tmp/nbl-model-artifacts/qbase_assists_v0.1.0.json \
            --rebounds /tmp/nbl-model-artifacts/qbase_rebounds_v0.1.0.json \
            --prior /tmp/nbl-prior-snapshot.json \
            --source-receipt /tmp/nbl-source-receipt.json \
            --output-dir nbl_player_props_v1/data
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('nbl_player_props_v1/data/manifest.json').read_text())
          assert m['schema_version']=='nbl_runtime_assets_v1'
          assert m['market_data'] is False
          assert m['integrity']['qbase_retraining_is_explicit_only'] is True
          print('NBL_FEATURE_RUNTIME_ASSET_GATE=PASS',m['asset_revision'],m['prior_snapshot']['snapshot_revision'])
          PY
      - name: Commit validated runtime assets to feature branch
        run: |
          git config user.name 'nbl-assets-bot'
          git config user.email 'nbl-assets-bot@users.noreply.github.com'
          git add nbl_player_props_v1/data/
          if git diff --cached --quiet; then
            echo 'No NBL runtime asset changes.'
          else
            git commit -m 'Publish corrected 2025-26 NBL V1 runtime assets'
            git fetch origin feature/nbl-player-props-v1
            git rebase origin/feature/nbl-player-props-v1
            git push origin HEAD:feature/nbl-player-props-v1
          fi
