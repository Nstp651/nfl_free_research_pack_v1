name: Benchmark NCAA totals QBASE challengers

on:
  push:
    branches: [feature/ncaaf-totals-v1]
    paths:
      - 'ncaaf_totals_v1/model/challenge_qbase.py'
      - 'ncaaf_totals_v1/model/train_qbase.py'
      - 'ncaaf_totals_v1/model/requirements.txt'
      - '.github/workflows/ncaaf-qbase-challenge.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ncaaf-qbase-challenge
  cancel-in-progress: false

jobs:
  challenge:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ncaaf_totals_v1/model/requirements.txt
      - run: python -m pip install -r ncaaf_totals_v1/model/requirements.txt
      - name: Run nonlinear temporal challengers
        working-directory: ncaaf_totals_v1/model
        run: python challenge_qbase.py --start 2016 --end 2025 --cache /tmp/ncaaf-qbase-cache --output QBASE_CHALLENGERS.md
      - name: Verify challenger report was produced
        run: |
          test -s ncaaf_totals_v1/model/QBASE_CHALLENGERS.md
          grep -q 'ridge_full_100' ncaaf_totals_v1/model/QBASE_CHALLENGERS.md
      - name: Commit challenger audit
        shell: bash
        run: |
          git config user.name 'ncaaf-model-bot'
          git config user.email 'ncaaf-model-bot@users.noreply.github.com'
          git add ncaaf_totals_v1/model/QBASE_CHALLENGERS.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Audit NCAA totals QBASE challengers'
          git fetch origin feature/ncaaf-totals-v1
          git rebase origin/feature/ncaaf-totals-v1
          git push origin 'HEAD:feature/ncaaf-totals-v1'
