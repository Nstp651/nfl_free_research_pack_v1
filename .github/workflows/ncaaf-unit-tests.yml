name: NCAA research-pack unit tests

on:
  push:
    branches: [feature/ncaaf-totals-v1, feature/ncaaf-integer-totals-v1.1, main]
    paths:
      - 'ncaaf_totals_v1/**'
      - '.github/workflows/ncaaf-unit-tests.yml'
  pull_request:
    paths:
      - 'ncaaf_totals_v1/**'
      - '.github/workflows/ncaaf-unit-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r ncaaf_totals_v1/requirements.txt pytest==8.4.2
      - name: Python integrity tests
        working-directory: ncaaf_totals_v1
        run: pytest -q tests
      - name: Worker contract tests
        working-directory: ncaaf_totals_v1
        run: node --test worker/index.test.mjs
      - name: Market Worker contract tests
        working-directory: ncaaf_totals_v1/market_worker
        run: node --test index.test.mjs
