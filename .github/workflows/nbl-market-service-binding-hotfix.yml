name: NBL Market service binding hotfix bootstrap

on:
  push:
    branches:
      - fix/nbl-market-research-service-binding

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nbl-market-research-service-binding
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply narrow Market-to-Research service binding fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_one(path, old, new):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}\n--- OLD ---\n{old}')
              p.write_text(text.replace(old,new),encoding='utf-8')

          path='nbl_player_props_v1/market_worker/wrangler.toml'
          p=Path(path)
          text=p.read_text(encoding='utf-8')
          marker='RESEARCH_BASE = "https://nbl-player-props-research-v1.nickarnott01.workers.dev"\n'
          if marker not in text:
              raise SystemExit('wrangler RESEARCH_BASE marker missing')
          p.write_text(text + '\n# Production Worker-to-Worker transport. Public URL remains a local/test fallback.\n[[services]]\nbinding = "RESEARCH"\nservice = "nbl-player-props-research-v1"\n',encoding='utf-8')

          path='nbl_player_props_v1/market_worker/index.js'
          replace_one(path,
          "async function getJson(url){const res=await fetch(url,{headers:{accept:'application/json','user-agent':'nbl-market-eval/1.0'},signal:AbortSignal.timeout(15_000)});const text=await res.text();need(text.length<4_000_000,'Research response too large');let body;try{body=JSON.parse(text);}catch{throw new Error('Research response invalid JSON');}need(res.ok,`Research Worker ${res.status}: ${body?.error||'request failed'}`);return body;}",
          "async function getJson(url,env){const request=new Request(url,{headers:{accept:'application/json','user-agent':'nbl-market-eval/1.0'},signal:AbortSignal.timeout(15_000)});const res=env?.RESEARCH&&typeof env.RESEARCH.fetch==='function'?await env.RESEARCH.fetch(request):await fetch(request);const text=await res.text();need(text.length<4_000_000,'Research response too large');let body;try{body=JSON.parse(text);}catch{throw new Error(`Research response invalid JSON (${res.status})`);}need(res.ok,`Research Worker ${res.status}: ${body?.error||'request failed'}`);return body;}")
          replace_one(path,
          "const base=researchBase(env),run=await getJson(`${base}/v1/match-runs/${runId}`);",
          "const base=researchBase(env),run=await getJson(`${base}/v1/match-runs/${runId}`,env);")
          replace_one(path,
          "const fetched=await getJson(`${base}/v1/match-runs/${runId}/players/${encodeURIComponent(key)}`);",
          "const fetched=await getJson(`${base}/v1/match-runs/${runId}/players/${encodeURIComponent(key)}`,env);")
          replace_one(path,
          "supported_sources:['odds_api','screenshot','public_web']});",
          "supported_sources:['odds_api','screenshot','public_web'],research_transport:env?.RESEARCH&&typeof env.RESEARCH.fetch==='function'?'service_binding':'public_fetch_fallback'});")

          path='nbl_player_props_v1/market_worker/index.test.mjs'
          p=Path(path)
          text=p.read_text(encoding='utf-8')
          addition=r'''

test('uses Cloudflare Research service binding when present instead of global fetch',async()=>{
  const old=globalThis.fetch;
  const calls=[];
  try{
    globalThis.fetch=async()=>{throw new Error('global fetch must not be used when service binding is present');};
    const serviceEnv={...env,RESEARCH:{fetch:async request=>{
      const url=String(request.url);calls.push(url);
      if(url.endsWith(`/v1/match-runs/${RUN}`))return new Response(JSON.stringify(runBody),{status:200});
      if(url.includes(`/v1/match-runs/${RUN}/players/`))return new Response(JSON.stringify(playerBody),{status:200});
      return new Response(JSON.stringify({error:'unexpected'}),{status:404});
    }}};
    const out=await evaluate({run_id:RUN,expected_freeze_receipt_sha256:RECEIPT,markets:[market()]},serviceEnv);
    assert.equal(out.p_model_status,'FROZEN');
    assert.equal(out.p_model_mutated,false);
    assert.equal(calls.length,2);
    assert.ok(calls[0].endsWith(`/v1/match-runs/${RUN}`));
    assert.ok(calls[1].endsWith('/players/id%3Ap1'));
  }finally{globalThis.fetch=old;}
});
'''
          if "uses Cloudflare Research service binding when present" in text:
              raise SystemExit('service binding regression test already present')
          p.write_text(text+addition,encoding='utf-8')
          PY

      - name: Run all NBL Worker tests
        shell: bash
        run: node --test nbl_player_props_v1/worker/*.test.mjs nbl_player_props_v1/market_worker/*.test.mjs

      - name: Validate Market Wrangler configuration
        shell: bash
        working-directory: nbl_player_props_v1/market_worker
        run: npx wrangler@latest deploy --dry-run

      - name: Commit tested fix and remove bootstrap workflow
        shell: bash
        run: |
          rm .github/workflows/nbl-market-service-binding-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nbl_player_props_v1/market_worker .github/workflows/nbl-market-service-binding-hotfix.yml
          git commit -m "Bind NBL Market Worker to Research service"
          git push origin HEAD:fix/nbl-market-research-service-binding
