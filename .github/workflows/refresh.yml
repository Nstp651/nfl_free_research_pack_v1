name: Refresh NFL Free Research Packs

defaults:
  run:
    working-directory: nfl_free_research_pack_v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh.yml'
      - 'nfl_free_research_pack_v1/**'
      - '!nfl_free_research_pack_v1/data/**'
  pull_request:
  workflow_dispatch:
    inputs:
      season:
        description: "NFL season"
        required: true
        default: "2026"
      week:
        description: "Optional week override (leave blank for automatic active week)"
        required: false
        default: ""
  schedule:
    # Shortly after the nflverse FTN/snap update windows.
    - cron: "25 0,6,12,18 * * *"

permissions:
  contents: write

concurrency:
  group: nfl-pack-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # tested v4 revision
        with:
          # A queued refresh must include commits from completed acceptance runs.
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # tested v5 revision
        with:
          python-version: "3.12.14"
          cache: "pip"
          cache-dependency-path: nfl_free_research_pack_v1/requirements.txt

      - name: Install pinned data adapter
        run: pip install -r requirements.txt

      - name: Validate builder and API
        run: |
          python -m unittest discover -s tests -v
          node --test worker/index.test.mjs

      - name: Build active-week packs
        if: github.event_name != 'pull_request'
        env:
          SEASON: ${{ github.event.inputs.season || '2026' }}
          WEEK: ${{ github.event.inputs.week || '' }}
        run: |
          export SOURCE_COMMIT="$(git rev-parse HEAD)"
          if [ -n "$WEEK" ]; then
            python build_pack.py --season "$SEASON" --week "$WEEK" --output data --history-seasons 2 --verify-sources
          else
            python build_pack.py --season "$SEASON" --output data --history-seasons 2 --verify-sources
          fi

      - name: Validate published manifest
        if: github.event_name != 'pull_request'
        run: python validate_pack.py data

      - name: Commit refreshed data
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "nfl-pack-bot"
          git config user.email "nfl-pack-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Refresh NFL research packs"
            git push
          fi

      - name: Verify Worker handler against the exact published GitHub revision
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          DATA_COMMIT=$(git rev-parse HEAD)
          SEASON=$(python -c 'import json; print(json.load(open("data/manifest.json"))["season"])')
          WEEK=$(python -c 'import json; print(json.load(open("data/manifest.json"))["active_week"])')
          node worker/acceptance.mjs --season "$SEASON" --week "$WEEK" --data-base-url "https://raw.githubusercontent.com/Nstp651/nfl_free_research_pack_v1/$DATA_COMMIT/nfl_free_research_pack_v1/data" --output data/handler_acceptance.json
          git add data/handler_acceptance.json
          if ! git diff --cached --quiet; then
            git commit -m "Record real-source Worker handler acceptance"
            git push
          fi
