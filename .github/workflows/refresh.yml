name: Refresh NFL Free Research Packs

defaults:
  run:
    working-directory: nfl_free_research_pack_v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh.yml'
      - 'nfl_free_research_pack_v1/**'
      - '!nfl_free_research_pack_v1/data/**'
  pull_request:
  workflow_dispatch:
    inputs:
      season:
        description: "NFL season"
        required: true
        default: "2026"
      week:
        description: "Optional week override (leave blank for automatic active week)"
        required: false
        default: ""
  schedule:
    # Shortly after the nflverse FTN/snap update windows.
    - cron: "25 0,6,12,18 * * *"

permissions:
  contents: write

concurrency:
  group: nfl-pack-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: nfl_free_research_pack_v1/requirements.txt

      - name: Install pinned data adapter
        run: pip install -r requirements.txt

      - name: Validate builder and API
        run: |
          python -m unittest discover -s tests -v
          node --test worker/index.test.mjs

      - name: Build active-week packs
        if: github.event_name != 'pull_request'
        env:
          SEASON: ${{ github.event.inputs.season || '2026' }}
          WEEK: ${{ github.event.inputs.week || '' }}
        run: |
          if [ -n "$WEEK" ]; then
            python build_pack.py --season "$SEASON" --week "$WEEK" --output data --history-seasons 2
          else
            python build_pack.py --season "$SEASON" --output data --history-seasons 2
          fi

      - name: Validate published manifest
        if: github.event_name != 'pull_request'
        run: python validate_pack.py data

      - name: Commit refreshed data
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "nfl-pack-bot"
          git config user.email "nfl-pack-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Refresh NFL research packs"
            git push
          fi
