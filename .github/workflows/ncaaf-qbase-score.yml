name: Score NCAA research slates with QBASE

on:
  push:
    branches: [feature/ncaaf-totals-v1, feature/ncaaf-integer-totals-v1.1, main]
    paths:
      - 'ncaaf_totals_v1/data/**'
      - 'ncaaf_totals_v1/model/qbase_v0.1.0.json'
      - 'ncaaf_totals_v1/model/score_slate.py'
      - 'ncaaf_totals_v1/model/train_qbase.py'
      - '.github/workflows/ncaaf-qbase-score.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ncaaf-qbase-score-${{ github.ref }}
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ncaaf_totals_v1/model/requirements.txt
      - run: python -m pip install -r ncaaf_totals_v1/model/requirements.txt
      - name: Score every published research slate
        working-directory: ncaaf_totals_v1
        run: python model/score_slate.py --data data --artifact model/qbase_v0.1.0.json --output-root model/slates
      - name: Validate market-blind QBASE output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files=list(Path('ncaaf_totals_v1/model/slates').glob('*/*.json'))
          assert files
          for p in files:
            x=json.loads(p.read_text())
            assert x['market_data'] is False
            assert x.get('schema_version') == '0.1.0'
            assert x.get('probability_schema_version') == '0.2.0'
            assert x.get('integer_line_method') == 'continuity_corrected_discrete_mass'
            assert len(x['qbase_revision'])==16
            assert x['games']
            grid_meta=x.get('supported_total_grid',{})
            assert grid_meta.get('min') <= 20.0 and grid_meta.get('max') >= 100.5
            assert abs(float(grid_meta.get('step'))-0.5) < 1e-12
            for g in x['games']:
              grid=g['probability_grid']; assert grid
              assert all(abs(r['over']+r.get('push',0)+r['under']-1)<3e-8 for r in grid)
              assert all(grid[i+1]['over'] <= grid[i]['over']+1e-10 for i in range(len(grid)-1))
              assert all(grid[i+1]['under'] >= grid[i]['under']-1e-10 for i in range(len(grid)-1))
              integers=[r for r in grid if abs(r['line']-round(r['line']))<1e-9]
              halves=[r for r in grid if abs(r['line']-round(r['line']))>=1e-9]
              assert integers and halves
              assert all(r.get('push',0) >= 0 for r in integers)
              assert any(r.get('push',0) > 0 for r in integers)
              assert all(abs(r.get('push',0)) < 1e-12 for r in halves)
          print(f'validated {len(files)} qbase slate files with integer push support')
          PY
      - name: Commit QBASE slate outputs
        if: github.ref == 'refs/heads/feature/ncaaf-totals-v1' || github.ref == 'refs/heads/feature/ncaaf-integer-totals-v1.1' || github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name 'ncaaf-model-bot'
          git config user.email 'ncaaf-model-bot@users.noreply.github.com'
          git add ncaaf_totals_v1/model/slates
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh NCAA QBASE slate outputs'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:${GITHUB_REF_NAME}"
