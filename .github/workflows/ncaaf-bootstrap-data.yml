name: Bootstrap NCAA 2026 research data

on:
  push:
    branches: [feature/ncaaf-totals-v1]
    paths:
      - 'ncaaf_totals_v1/build_pack.py'
      - 'ncaaf_totals_v1/build_pack_entry.py'
      - 'ncaaf_totals_v1/validate_pack.py'
      - 'ncaaf_totals_v1/requirements.txt'
      - '.github/workflows/ncaaf-bootstrap-data.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ncaaf-bootstrap-data
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r ncaaf_totals_v1/requirements.txt
      - name: Build current 2026 slate
        working-directory: ncaaf_totals_v1
        run: python build_pack_entry.py --season 2026 --week auto --output data
      - name: Validate pack
        run: python ncaaf_totals_v1/validate_pack.py --data ncaaf_totals_v1/data
      - name: Commit generated data
        shell: bash
        run: |
          git config user.name 'ncaaf-pack-bot'
          git config user.email 'ncaaf-pack-bot@users.noreply.github.com'
          git add ncaaf_totals_v1/data
          if git diff --cached --quiet; then
            echo 'Generated data already current.'
            exit 0
          fi
          git commit -m 'Refresh real NCAA 2026 research pack'
          git push origin 'HEAD:feature/ncaaf-totals-v1'
