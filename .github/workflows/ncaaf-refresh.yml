name: Refresh NCAA totals research pack

on:
  workflow_dispatch:
    inputs:
      season:
        description: NCAA season (blank = current UTC year)
        required: false
        type: string
      week:
        description: NCAA week (blank = auto-resolve next active week)
        required: false
        type: string
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: ncaaf-research-pack-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ncaaf_totals_v1/requirements.txt

      - name: Install builder dependencies
        run: python -m pip install -r ncaaf_totals_v1/requirements.txt

      - name: Resolve requested season/week
        id: target
        shell: bash
        run: |
          SEASON='${{ inputs.season }}'
          WEEK='${{ inputs.week }}'
          if [ -z "$SEASON" ]; then SEASON="$(date -u +%Y)"; fi
          if [ -z "$WEEK" ]; then WEEK='auto'; fi
          echo "season=$SEASON" >> "$GITHUB_OUTPUT"
          echo "week=$WEEK" >> "$GITHUB_OUTPUT"

      - name: Build market-blind weekly slate
        working-directory: ncaaf_totals_v1
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python build_pack_entry.py \
            --season '${{ steps.target.outputs.season }}' \
            --week '${{ steps.target.outputs.week }}' \
            --output data

      - name: Validate generated pack
        run: python ncaaf_totals_v1/validate_pack.py --data ncaaf_totals_v1/data

      - name: Record build summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          m=json.loads(Path('ncaaf_totals_v1/data/manifest.json').read_text())
          s=m['slates'][0]
          print('## NCAA totals research pack')
          print(f"- Slate: `{s['slate_id']}`")
          print(f"- Revision: `{s['pack_revision']}`")
          print(f"- FBS-v-FBS games: **{s['game_count']}**")
          print(f"- Current data through week: `{s.get('current_season_data_through_week')}`")
          print(f"- Source health: `{m['source_health']['status']}`")
          print('- Market data: **false**')
          PY

      - name: Commit changed research pack
        shell: bash
        run: |
          if git diff --quiet -- ncaaf_totals_v1/data; then
            echo 'No NCAA research-pack change.'
            exit 0
          fi
          git config user.name 'ncaaf-pack-bot'
          git config user.email 'ncaaf-pack-bot@users.noreply.github.com'
          git add ncaaf_totals_v1/data
          git commit -m "Refresh NCAA totals research pack"
          git push origin "HEAD:${GITHUB_REF_NAME}"
