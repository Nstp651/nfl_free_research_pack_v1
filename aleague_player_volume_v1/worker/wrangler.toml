name = "aleague-player-volume-research-v1"
main = "index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[durable_objects]
bindings = [
  { name = "MATCH_RUNS", class_name = "AleaguePlayerVolumeRun" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AleaguePlayerVolumeRun"]

[build]
command = "if [ -f build_source_commit.mjs ]; then node build_source_commit.mjs; else node aleague_player_volume_v1/worker/build_source_commit.mjs; fi"
