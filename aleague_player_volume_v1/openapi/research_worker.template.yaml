openapi: 3.1.0
info:
  title: A-League Player Volume Research Freeze API
  version: 1.0.0
  description: Market-blind run, research checkpoint and immutable P_model freeze service. Replace the server host only after deployment.
servers:
  - url: https://aleague-player-volume-research-v1.REPLACE.workers.dev
paths:
  /health:
    get:
      operationId: getAleagueResearchHealth
      summary: Check market-blind research/freeze service health.
      responses:
        '200':
          description: Health status.
          content:
            application/json:
              schema: {type: object}
  /v1/runs:
    post:
      operationId: createAleaguePlayerVolumeRun
      summary: Create a new persistent market-blind A-League run lock.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRun'
      responses:
        '201':
          description: Persistent run created.
          content:
            application/json:
              schema: {type: object}
  /v1/runs/{run_id}:
    get:
      operationId: getAleaguePlayerVolumeRun
      summary: Read run status and immutable source/revision lock.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Run status.
          content:
            application/json:
              schema: {type: object}
  /v1/runs/{run_id}/research:
    get:
      operationId: getAleaguePlayerVolumeResearch
      summary: Read the latest market-blind research checkpoint.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Research checkpoint.
          content:
            application/json:
              schema: {type: object}
    post:
      operationId: checkpointAleaguePlayerVolumeResearch
      summary: Persist or replace research before freeze. Rejected after freeze.
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [research]
              properties:
                research:
                  type: object
                  description: Must satisfy aleague_player_volume_research_v1. Server recursively rejects market/price fields.
                  additionalProperties: true
      responses:
        '200':
          description: Research checkpoint persisted.
          content:
            application/json:
              schema: {type: object}
  /v1/runs/{run_id}/freeze:
    post:
      operationId: freezeAleaguePlayerVolumeModel
      summary: Build and persist the deterministic multi-head P_model from checkpointed research.
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FreezeRequest'
      responses:
        '200':
          description: Immutable freeze plus model-input and freeze receipts.
          content:
            application/json:
              schema: {type: object}
  /v1/runs/{run_id}/model-inputs:
    get:
      operationId: getAleagueFrozenModelInputs
      summary: Read the exact hash-addressed quantitative inputs persisted at freeze.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Immutable model input snapshot. Available only after freeze.
          content:
            application/json:
              schema: {type: object}
  /v1/runs/{run_id}/frozen:
    get:
      operationId: getAleagueFrozenModel
      summary: Read the immutable frozen Shots/SOT/Saves probability artifact.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Frozen probability artifact.
          content:
            application/json:
              schema: {type: object}
components:
  parameters:
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-f]{64}$'
  schemas:
    CreateRun:
      type: object
      additionalProperties: false
      required: [fixture_id, run_mode, pack_revision, qbase_revision, advanced_revision]
      properties:
        fixture_id: {type: string, minLength: 1}
        run_mode:
          type: string
          enum: [ALL, SHOOTING_ONLY, SAVES_ONLY]
        pack_revision: {type: string, minLength: 1}
        qbase_revision: {type: string, minLength: 1}
        advanced_revision: {type: string, minLength: 1}
    TeamModel:
      type: object
      additionalProperties: false
      required: [team_id, shot_mean, shot_dispersion, unmodelled_weight, unmodelled_p_sot, evidence_source_ids, quant_input_receipt_sha256]
      properties:
        team_id: {type: string}
        shot_mean: {type: number, minimum: 0}
        shot_dispersion: {type: number, exclusiveMinimum: 0}
        unmodelled_weight: {type: number, minimum: 0}
        unmodelled_p_sot: {type: number, minimum: 0, maximum: 1}
        evidence_source_ids:
          type: array
          minItems: 1
          items: {type: string}
        quant_input_receipt_sha256: {$ref: '#/components/schemas/Hash64'}
    OutfieldModel:
      type: object
      additionalProperties: false
      required: [player_id, team_id, shots_per90_prior, role_multiplier, p_sot_given_shot, shot_dispersion, confidence, fragility, evidence_source_ids, quant_input_receipt_sha256]
      properties:
        player_id: {type: string}
        team_id: {type: string}
        shots_per90_prior: {type: number, minimum: 0}
        role_multiplier: {type: number, exclusiveMinimum: 0, maximum: 2}
        p_sot_given_shot: {type: number, minimum: 0, maximum: 1}
        shot_dispersion: {type: number, exclusiveMinimum: 0}
        confidence: {type: string, enum: [A, B, C]}
        fragility: {type: string, enum: [LOW, MEDIUM, HIGH]}
        evidence_source_ids:
          type: array
          minItems: 1
          items: {type: string}
        quant_input_receipt_sha256: {$ref: '#/components/schemas/Hash64'}
    GoalkeeperModel:
      type: object
      additionalProperties: false
      required: [player_id, team_id, p_save_given_sot, save_dispersion, confidence, fragility, evidence_source_ids, quant_input_receipt_sha256]
      properties:
        player_id: {type: string}
        team_id: {type: string}
        p_save_given_sot: {type: number, minimum: 0, maximum: 1}
        save_dispersion: {type: number, exclusiveMinimum: 0}
        confidence: {type: string, enum: [A, B, C]}
        fragility: {type: string, enum: [LOW, MEDIUM, HIGH]}
        evidence_source_ids:
          type: array
          minItems: 1
          items: {type: string}
        quant_input_receipt_sha256: {$ref: '#/components/schemas/Hash64'}
    FreezeRequest:
      type: object
      additionalProperties: false
      required: [team_models, outfield_models, goalkeeper_models]
      properties:
        team_models:
          type: array
          minItems: 2
          maxItems: 2
          items: {$ref: '#/components/schemas/TeamModel'}
        outfield_models:
          type: array
          items: {$ref: '#/components/schemas/OutfieldModel'}
        goalkeeper_models:
          type: array
          items: {$ref: '#/components/schemas/GoalkeeperModel'}
    Hash64:
      type: string
      pattern: '^[0-9a-f]{64}$'
